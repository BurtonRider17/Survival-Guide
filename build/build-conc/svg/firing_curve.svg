<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Brick firing curve"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="60" y="30" width="560" height="190" rx="0" fill="#f7f9fa" stroke="#9aa7b0" stroke-width="0.8" /><line x1="60" y1="220.0" x2="620" y2="220.0" stroke="#dde3e7" stroke-width="0.6"/><text x="54" y="223.0" font-size="8.5" text-anchor="end" font-weight="normal" fill="#1f2a33">0</text><line x1="60" y1="188.33333333333334" x2="620" y2="188.33333333333334" stroke="#dde3e7" stroke-width="0.6"/><text x="54" y="191.3" font-size="8.5" text-anchor="end" font-weight="normal" fill="#1f2a33">200</text><line x1="60" y1="156.66666666666669" x2="620" y2="156.66666666666669" stroke="#dde3e7" stroke-width="0.6"/><text x="54" y="159.7" font-size="8.5" text-anchor="end" font-weight="normal" fill="#1f2a33">400</text><line x1="60" y1="125.0" x2="620" y2="125.0" stroke="#dde3e7" stroke-width="0.6"/><text x="54" y="128.0" font-size="8.5" text-anchor="end" font-weight="normal" fill="#1f2a33">600</text><line x1="60" y1="93.33333333333334" x2="620" y2="93.33333333333334" stroke="#dde3e7" stroke-width="0.6"/><text x="54" y="96.3" font-size="8.5" text-anchor="end" font-weight="normal" fill="#1f2a33">800</text><line x1="60" y1="61.66666666666666" x2="620" y2="61.66666666666666" stroke="#dde3e7" stroke-width="0.6"/><text x="54" y="64.7" font-size="8.5" text-anchor="end" font-weight="normal" fill="#1f2a33">1000</text><line x1="60" y1="30.0" x2="620" y2="30.0" stroke="#dde3e7" stroke-width="0.6"/><text x="54" y="33.0" font-size="8.5" text-anchor="end" font-weight="normal" fill="#1f2a33">1200</text><text x="60.0" y="234.0" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">day 0</text><text x="140.0" y="234.0" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">day 1</text><text x="220.0" y="234.0" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">day 2</text><text x="300.0" y="234.0" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">day 3</text><text x="380.0" y="234.0" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">day 4</text><text x="460.0" y="234.0" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">day 5</text><text x="540.0" y="234.0" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">day 6</text><text x="620.0" y="234.0" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">day 7</text><rect x="61" y="201.0" width="558" height="19.0" rx="0" fill="#e3f2fd" stroke="none" stroke-width="0" /><text x="68" y="214.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">1 Water-smoking ≤120 °C: steam leaves — go SLOW</text><rect x="61" y="125.0" width="558" height="76.0" rx="0" fill="#fff8e1" stroke="none" stroke-width="0" /><text x="68" y="138.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">2 Clay water driven off; quartz change at 573 °C — slow</text><rect x="61" y="77.5" width="558" height="47.5" rx="0" fill="#ffe0b2" stroke="none" stroke-width="0" /><text x="68" y="90.5" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">3 Carbon & sulfur burn off — keep air flowing</text><rect x="61" y="45.83333333333334" width="558" height="31.666666666666657" rx="0" fill="#ffccbc" stroke="none" stroke-width="0" /><text x="68" y="58.8" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">4 Vitrification 900–1,100 °C: bricks fuse (hold 'soak')</text><polyline points="60.0,216.8 180.0,202.6 236.0,196.2 316.0,125.0 364.0,77.5 412.0,61.7 460.0,61.7 484.0,109.2 620.0,201.0" fill="none" stroke="#c0392b" stroke-width="2.4"/><text x="492.0" y="90.2" font-size="9" text-anchor="start" font-weight="700" fill="#c0392b">seal & cool slowly</text><text x="492.0" y="102.8" font-size="9" text-anchor="start" font-weight="normal" fill="#c0392b">(do not open hot)</text><text x="626" y="64.7" font-size="8.5" text-anchor="start" font-weight="normal" fill="#1f2a33">bright orange</text><text x="626" y="96.3" font-size="8.5" text-anchor="start" font-weight="normal" fill="#1f2a33">cherry red</text><text x="626" y="128.0" font-size="8.5" text-anchor="start" font-weight="normal" fill="#1f2a33">dull red glow</text><text x="626" y="199.2" font-size="8.5" text-anchor="start" font-weight="normal" fill="#1f2a33">no glow</text><text x="10" y="254.0" font-size="8.8" text-anchor="start" font-weight="normal" fill="#1f2a33" font-style="italic">Typical small clamp or updraft kiln. Large clamps take 1–2 weeks to fire and 1–2 weeks to cool. Glow colors seen in a dark spy-hole.</text></svg>