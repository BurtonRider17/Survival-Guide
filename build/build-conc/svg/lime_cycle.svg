<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="The lime cycle"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="265.0" y="29.0" width="190" height="72" rx="10" fill="#eceff1" stroke="#1f2a33" stroke-width="1.4"/><text x="360.0" y="47.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1f2a33">1. LIMESTONE</text><text x="360.0" y="63.0" font-size="13" text-anchor="middle" font-weight="700" fill="#8a4b08">CaCO₃</text><text x="360.0" y="79.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#44525e">limestone, chalk, marble,</text><text x="360.0" y="90.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#44525e">shells, coral, caliche</text><rect x="458.75" y="154.0" width="190" height="72" rx="10" fill="#fff3e0" stroke="#1f2a33" stroke-width="1.4"/><text x="553.75" y="172.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1f2a33">2. QUICKLIME</text><text x="553.75" y="188.0" font-size="13" text-anchor="middle" font-weight="700" fill="#8a4b08">CaO</text><text x="553.75" y="204.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#44525e">white lumps, ~44% lighter;</text><text x="553.75" y="215.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#44525e">CAUSTIC — reacts with water</text><rect x="265.0" y="279.0" width="190" height="72" rx="10" fill="#e3f2fd" stroke="#1f2a33" stroke-width="1.4"/><text x="360.0" y="297.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1f2a33">3. SLAKED LIME</text><text x="360.0" y="313.0" font-size="13" text-anchor="middle" font-weight="700" fill="#8a4b08">Ca(OH)₂</text><text x="360.0" y="329.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#44525e">lime putty (wet) or</text><text x="360.0" y="340.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#44525e">hydrated lime (dry powder)</text><rect x="71.25" y="154.00000000000003" width="190" height="72" rx="10" fill="#e8f5e9" stroke="#1f2a33" stroke-width="1.4"/><text x="166.25" y="172.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1f2a33">4. CARBONATED LIME</text><text x="166.25" y="188.0" font-size="13" text-anchor="middle" font-weight="700" fill="#8a4b08">CaCO₃</text><text x="166.25" y="204.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#44525e">hard mortar / plaster in</text><text x="166.25" y="215.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#44525e">the wall: 'stone' again</text><path d="M462.7,84.0 A193.75,125 0 0 1 537.0,139.2" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arr)"/><text x="565" y="52.0" font-size="10" text-anchor="middle" font-weight="700" fill="#c0392b">BURN 900–1,000 °C</text><text x="565" y="65.0" font-size="9.2" text-anchor="middle" font-weight="normal" fill="#1f2a33">drives off CO₂ (2–4 days)</text><path d="M537.0,240.8 A193.75,125 0 0 1 462.7,296.0" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arr)"/><text x="565" y="318.0" font-size="10" text-anchor="middle" font-weight="700" fill="#c0392b">SLAKE: add to water</text><text x="565" y="331.0" font-size="9.2" text-anchor="middle" font-weight="normal" fill="#1f2a33">violent heat — boils!</text><path d="M257.3,296.0 A193.75,125 0 0 1 183.0,240.8" fill="none" stroke="#2f7fbf" stroke-width="2.4" marker-end="url(#arb)"/><text x="155" y="318.0" font-size="10" text-anchor="middle" font-weight="700" fill="#2f7fbf">MIX with sand, build;</text><text x="155" y="331.0" font-size="9.2" text-anchor="middle" font-weight="normal" fill="#1f2a33">absorbs CO₂ over months</text><path d="M183.0,139.2 A193.75,125 0 0 1 257.3,84.0" fill="none" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#ar)"/><text x="155" y="52.0" font-size="10" text-anchor="middle" font-weight="700" fill="#2e7d32">CYCLE COMPLETE</text><text x="155" y="65.0" font-size="9.2" text-anchor="middle" font-weight="normal" fill="#1f2a33">repeat with new stone</text><text x="360" y="186.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1f4e5f">THE LIME CYCLE</text><text x="360" y="202.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">CaCO₃ → CaO + CO₂ → Ca(OH)₂ → CaCO₃</text></svg>