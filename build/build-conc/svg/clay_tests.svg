<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Field tests for clay"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><text x="110" y="20.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1f2a33">A. Ribbon test</text><path d="M40,120 q30,-40 70,-30 q20,5 30,20" fill="#f1c9a5" stroke="#1f2a33"/><path d="M60,135 q40,30 80,-15" fill="#f1c9a5" stroke="#1f2a33"/><path d="M110,112 q30,10 40,60 q2,10 -8,12 q-10,-30 -32,-58z" fill="#c27c5a" stroke="#1f2a33" stroke-width="0.8"/><text x="20" y="210.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">Squeeze moist soil out between</text><text x="20" y="222.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">thumb and finger into a ribbon:</text><text x="20" y="238.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">< 1 in (25 mm): sandy, low clay</text><text x="20" y="250.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">1–2 in: clay loam — adobe, rammed</text><text x="20" y="262.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">earth, cob</text><text x="20" y="274.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">> 2 in (50 mm): clay — bricks</text><text x="20" y="286.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">(temper with sand)</text><text x="360" y="20.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1f2a33">B. Coil test</text><path d="M300,120 a40,40 0 1,1 60,30" fill="none" stroke="#c27c5a" stroke-width="9" stroke-linecap="round"/><circle cx="330" cy="105" r="22" fill="#f1c9a5" stroke="#1f2a33"/><text x="330" y="109.0" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">finger</text><line x1="298" y1="92" x2="306" y2="96" stroke="#fff" stroke-width="2"/><line x1="305" y1="140" x2="313" y2="144" stroke="#fff" stroke-width="2"/><text x="270" y="210.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">Roll a pencil-thick (6 mm) coil and</text><text x="270" y="222.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">wrap it round a finger:</text><text x="270" y="238.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">no cracks = plastic clay, good for</text><text x="270" y="250.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">throwing bricks; cracks = lean,</text><text x="270" y="262.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">breaks = too sandy for fired brick</text><text x="600" y="20.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1f2a33">C. Shrinkage bar</text><rect x="490" y="60" width="220" height="30" rx="0" fill="#c9a26b" stroke="#8d6e45" stroke-width="1" /><rect x="496" y="66" width="208" height="18" rx="0" fill="#c27c5a" stroke="#1f2a33" stroke-width="0.6" /><rect x="490" y="120" width="220" height="30" rx="0" fill="#c9a26b" stroke="#8d6e45" stroke-width="1" /><rect x="496" y="126" width="190" height="18" rx="0" fill="#d7a184" stroke="#1f2a33" stroke-width="0.6" /><rect x="686" y="126" width="18" height="18" rx="0" fill="#fff" stroke="none" stroke-width="0" /><text x="480" y="55.0" font-size="8.8" text-anchor="start" font-weight="normal" fill="#1f2a33">wet, day 0 (inside 600×40×40 mm,</text><text x="480" y="113.0" font-size="8.8" text-anchor="start" font-weight="normal" fill="#1f2a33">dry, 7 days in shade</text><line x1="496" y1="162" x2="686" y2="162" stroke="#1f2a33" stroke-width="0.8" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="591.0" y="158.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2a33"></text><line x1="686" y1="162" x2="704" y2="162" stroke="#1f2a33" stroke-width="0.8" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="695.0" y="158.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2a33"></text><text x="695" y="177.0" font-size="8.8" text-anchor="middle" font-weight="normal" fill="#1f2a33">gap</text><text x="490" y="210.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">Pack the box (oiled) with moist soil;</text><text x="490" y="222.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">measure the gap when dry.</text><text x="490" y="238.0" font-size="9.2" text-anchor="start" font-weight="700" fill="#1f2a33">Shrinkage % = gap ÷ 600 × 100</text><text x="490" y="254.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">Fired brick: aim 4–8%</text><text x="490" y="266.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">Adobe / rammed earth: < 3–4%</text><text x="490" y="278.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">Bar cracked or > 10%: add sand</text><text x="490" y="290.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">or grog (crushed fired brick)</text></svg>