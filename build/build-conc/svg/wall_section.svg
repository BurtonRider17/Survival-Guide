xt><text x="545" y="192.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">continuous around the house</text><text x="545" y="230.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">Vertical #4 bar in grouted cells:</text><text x="545" y="242.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">corners, jambs, ≤ 4 ft apart</text><text x="545" y="285.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">Slab 4 in on vapor barrier, rigid</text><text x="545" y="297.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">insulation, 4–6 in gravel</text><line x1="542" y1="44" x2="460" y2="22" stroke="#1f2a33" stroke-width="0.8"/><circle cx="460" cy="22" r="2" fill="#1f2a33"/><line x1="542" y1="102" x2="470" y2="40" stroke="#1f2a33" stroke-width="0.8"/><circle cx="470" cy="40" r="2" fill="#1f2a33"/><line x1="542" y1="144" x2="305" y2="88" stroke="#1f2a33" stroke-width="0.8"/><circle cx="305" cy="88" r="2" fill="#1f2a33"/><line x1="542" y1="184" x2="309" y2="112" stroke="#1f2a33" stroke-width="0.8"/><circle cx="309" cy="112" r="2" fill="#1f2a33"/><line x1="542" y1="234" x2="282.0" y2="230" stroke="#1f2a33" stroke-width="0.8"/><circle cx="282.0" cy="230" r="2" fill="#1f2a33"/><line x1="542" y1="289" x2="500" y2="309" stroke="#1f2a33" stroke-width="0.8"/><circle cx="500" cy="309" r="2" fill="#1f2a33"/><text x="10" y="150.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">Exterior: lime or cement</text><text x="10" y="162.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">plaster over mesh</text><text x="10" y="200.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">Rigid insulation outside the</text><text x="10" y="212.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">masonry (cold climates)</text><text x="10" y="255.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">Damp-proof coating below</text><text x="10" y="267.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">grade (bitumen / lime)</text><text x="10" y="300.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">Ground slopes away 6 in in</text><text x="10" y="312.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">first 10 ft (5%)</text><text x="10" y="370.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">Gravel + perforated drain</text><text x="10" y="382.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">pipe to daylight</text><text x="10" y="452.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">Footing below frost line</text><text x="10" y="464.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">(see table)</text><line x1="150" y1="154" x2="214" y2="165" stroke="#1f2a33" stroke-width="0.8"/><circle cx="214" cy="165" r="2" fill="#1f2a33"/><line x1="150" y1="204" x2="225" y2="215" stroke="#1f2a33" stroke-width="0.8"/><circle cx="225" cy="215" r="2" fill="#1f2a33"/><line x1="150" y1="259" x2="242" y2="360" stroke="#1f2a33" stroke-width="0.8"/><circle cx="242" cy="360" r="2" fill="#1f2a33"/><line x1="140" y1="306" x2="110" y2="322" stroke="#1f2a33" stroke-width="0.8"/><circle cx="110" cy="322" r="2" fill="#1f2a33"/><line x1="150" y1="374" x2="180" y2="395" stroke="#1f2a33" stroke-width="0.8"/><circle cx="180" cy="395" r="2" fill="#1f2a33"/><line x1="150" y1="456" x2="192" y2="440" stroke="#1f2a33" stroke-width="0.8"/><circle cx="192" cy="440" r="2" fill="#1f2a33"/><text x="335" y="290.0" font-size="8.8" text-anchor="start" font-weight="normal" fill="#2f7fbf">finished floor ≥ 8 in above outside grade</text></g></svg>