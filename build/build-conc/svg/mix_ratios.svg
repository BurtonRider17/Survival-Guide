455" y1="464" x2="315.4545454545455" y2="468" stroke="#1f2a33" stroke-width="0.8"/><text x="315.4545454545455" y="479.0" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">0.8</text><line x1="370.0" y1="464" x2="370.0" y2="468" stroke="#1f2a33" stroke-width="0.8"/><text x="370.0" y="479.0" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">0.9</text><polyline points="102.7,339.0 140.9,364.0 190.0,389.0 250.0,414.0 326.4,439.0" fill="none" stroke="#c0392b" stroke-width="2.2"/><circle cx="102.7" cy="339.0" r="3" fill="#c0392b"/><circle cx="140.9" cy="364.0" r="3" fill="#c0392b"/><circle cx="190.0" cy="389.0" r="3" fill="#c0392b"/><circle cx="250.0" cy="414.0" r="3" fill="#c0392b"/><circle cx="326.4" cy="439.0" r="3" fill="#c0392b"/><text x="220.0" y="494.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">water ÷ cement (by weight)</text><text x="14" y="324.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">psi</text><text x="388" y="328.0" font-size="10" text-anchor="start" font-weight="700" fill="#1f2a33">How to read it:</text><text x="388" y="344.0" font-size="9.3" text-anchor="start" font-weight="normal" fill="#1f2a33">5 US gal water per 94-lb bag = 0.44</text><text x="388" y="358.0" font-size="9.3" text-anchor="start" font-weight="normal" fill="#1f2a33">6 gal per bag = 0.53  (good target)</text><text x="388" y="372.0" font-size="9.3" text-anchor="start" font-weight="normal" fill="#1f2a33">7 gal per bag = 0.62</text><text x="388" y="386.0" font-size="9.3" text-anchor="start" font-weight="normal" fill="#1f2a33">8 gal per bag = 0.71  (weak, porous)</text><text x="388" y="400.0" font-size="9.3" text-anchor="start" font-weight="normal" fill="#1f2a33">Every extra gallon of water per bag</text><text x="388" y="414.0" font-size="9.3" text-anchor="start" font-weight="normal" fill="#1f2a33">costs roughly 10–15% of strength.</text><text x="388" y="428.0" font-size="9.3" text-anchor="start" font-weight="normal" fill="#1f2a33">Count water already in wet sand —</text><text x="388" y="442.0" font-size="9.3" text-anchor="start" font-weight="normal" fill="#1f2a33">damp sand holds ~½–1 gal per bag.</text><text x="10" y="514.0" font-size="8.8" text-anchor="start" font-weight="normal" fill="#1f2a33" font-style="italic">Curve: ACI 211.1 typical values (1 psi ≈ 0.0069 MPa; 3,000 psi ≈ 21 MPa). Field-mixed concrete is usually weaker — design with margin.</text></svg>