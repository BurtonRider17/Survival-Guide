<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 255" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Brick mold"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><text x="200" y="20.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1f2a33">A. Four-brick gang mold (plan)</text><rect x="55" y="50" width="350" height="60" rx="0" fill="#c9a26b" stroke="#8d6e45" stroke-width="1.2" /><rect x="65" y="60" width="75" height="40" rx="0" fill="#fff" stroke="#1f2a33" stroke-width="0.8" /><rect x="150" y="60" width="75" height="40" rx="0" fill="#fff" stroke="#1f2a33" stroke-width="0.8" /><rect x="235" y="60" width="75" height="40" rx="0" fill="#fff" stroke="#1f2a33" stroke-width="0.8" /><rect x="320" y="60" width="75" height="40" rx="0" fill="#fff" stroke="#1f2a33" stroke-width="0.8" /><rect x="15" y="72" width="40" height="16" rx="0" fill="#c9a26b" stroke="#8d6e45" stroke-width="1" /><rect x="405" y="72" width="40" height="16" rx="0" fill="#c9a26b" stroke="#8d6e45" stroke-width="1" /><text x="17" y="105.0" font-size="8.5" text-anchor="start" font-weight="normal" fill="#1f2a33">handle</text><text x="407" y="105.0" font-size="8.5" text-anchor="start" font-weight="normal" fill="#1f2a33">handle</text><line x1="65" y1="128" x2="140" y2="128" stroke="#1f2a33" stroke-width="0.8" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="102.5" y="124.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">9 in (230 mm)</text><text x="175" y="124.0" font-size="9.3" text-anchor="start" font-weight="normal" fill="#1f2a33">each cell 9 × 4½ × 3 in inside</text><text x="175" y="136.0" font-size="9.3" text-anchor="start" font-weight="normal" fill="#1f2a33">→ fired brick ≈ 8¼ × 4 × 2¾ in</text><text x="55" y="180.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">No bottom: mold sits on a sanded board or ground. Make it</text><text x="55" y="192.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">~8–10% larger than the brick you want (drying + firing shrinkage).</text><text x="55" y="204.0" font-size="9.2" text-anchor="start" font-weight="normal" fill="#1f2a33">Adobe mold: 10 × 14 × 4 in (25 × 35 × 10 cm), 1 or 2 cells.</text><text x="590" y="20.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1f2a33">B. Throwing a brick</text><rect x="470" y="69" width="110" height="6" rx="0" fill="#d7ccc8" stroke="#1f2a33" stroke-width="0.5" /><rect x="490" y="49" width="8" height="20" rx="0" fill="#c9a26b" stroke="#8d6e45" stroke-width="1" /><rect x="552" y="49" width="8" height="20" rx="0" fill="#c9a26b" stroke="#8d6e45" stroke-width="1" /><text x="590" y="63.0" font-size="9.6" text-anchor="start" font-weight="normal" fill="#1f2a33">1 Wet + sand the mold</text><rect x="470" y="121" width="110" height="6" rx="0" fill="#d7ccc8" stroke="#1f2a33" stroke-width="0.5" /><rect x="490" y="101" width="8" height="20" rx="0" fill="#c9a26b" stroke="#8d6e45" stroke-width="1" /><rect x="552" y="101" width="8" height="20" rx="0" fill="#c9a26b" stroke="#8d6e45" stroke-width="1" /><ellipse cx="525" cy="109" rx="20" ry="10" fill="#c27c5a" stroke="#1f2a33"/><line x1="525" y1="83" x2="525" y2="99" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arr)"/><text x="590" y="115.0" font-size="9.6" text-anchor="start" font-weight="normal" fill="#1f2a33">2 Throw clot hard</text><rect x="470" y="173" width="110" height="6" rx="0" fill="#d7ccc8" stroke="#1f2a33" stroke-width="0.5" /><rect x="490" y="153" width="8" height="20" rx="0" fill="#c9a26b" stroke="#8d6e45" stroke-width="1" /><rect x="552" y="153" width="8" height="20" rx="0" fill="#c9a26b" stroke="#8d6e45" stroke-width="1" /><rect x="498" y="153" width="54" height="20" rx="0" fill="#c27c5a" stroke="#1f2a33" stroke-width="0.6" /><line x1="480" y1="151" x2="575" y2="151" stroke="#8d6e45" stroke-width="4"/><line x1="540" y1="143" x2="570" y2="143" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><text x="590" y="167.0" font-size="9.6" text-anchor="start" font-weight="normal" fill="#1f2a33">3 Strike off top</text><rect x="470" y="225" width="110" height="6" rx="0" fill="#d7ccc8" stroke="#1f2a33" stroke-width="0.5" /><rect x="498" y="205" width="54" height="20" rx="0" fill="#c27c5a" stroke="#1f2a33" stroke-width="0.6" /><rect x="490" y="179" width="8" height="20" rx="0" fill="#c9a26b" stroke="#8d6e45" stroke-width="1" /><rect x="552" y="179" width="8" height="20" rx="0" fill="#c9a26b" stroke="#8d6e45" stroke-width="1" /><line x1="525" y1="197" x2="525" y2="175" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><text x="590" y="219.0" font-size="9.6" text-anchor="start" font-weight="normal" fill="#1f2a33">4 Lift mold straight up</text></svg>