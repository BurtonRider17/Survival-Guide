<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Log notch types"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="0" y="0" width="780" height="330" fill="#fff" stroke="none" stroke-width="1.2" /><text x="100" y="24.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1f2a33">Saddle notch</text><text x="100" y="40.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#44525e">easiest round-log notch</text><rect x="20" y="150" width="160" height="44" fill="#d9b382" stroke="#8a5a2b" stroke-width="1.2" rx="6"/><path d="M20,120 L70,120 A 34 34 0 0 0 130 120 L180,120 L180,96 L20,96 Z" fill="#d9b382" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="100" cy="172" r="34" fill="#e3c79c" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="100" cy="172" r="22.1" fill="none" stroke="#8a5a2b" stroke-width="0.5" opacity="0.6"/><circle cx="100" cy="172" r="11.9" fill="none" stroke="#8a5a2b" stroke-width="0.5" opacity="0.6"/><line x1="130" y1="112" x2="170" y2="70" stroke="#1f2a33" stroke-width="0.8"/><circle cx="170" cy="70" r="2" fill="#1f2a33"/><text x="120" y="64.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">cup cut in upper log</text><text x="100" y="230.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">scribe the curve, cut a cup</text><text x="100" y="243.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">in the log's UNDERSIDE so</text><text x="100" y="256.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">water can't collect in it</text><text x="290" y="24.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1f2a33">Dovetail</text><text x="290" y="40.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#44525e">hewn logs; locks both ways</text><polygon points="240.0,90.0 340.0,98.0 340.0,134.0 240.0,130.0" fill="#d9b382" stroke="#8a5a2b" stroke-width="1.2" /><polygon points="240.0,138.0 340.0,146.0 340.0,182.0 240.0,178.0" fill="#e3c79c" stroke="#8a5a2b" stroke-width="1.2" /><polygon points="240.0,186.0 340.0,194.0 340.0,230.0 240.0,226.0" fill="#d9b382" stroke="#8a5a2b" stroke-width="1.2" /><text x="290" y="250.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">sloped faces shed water out</text><text x="290" y="263.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">and wedge corner tight</text><text x="480" y="24.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1f2a33">Square / half-lap</text><text x="480" y="40.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#44525e">simple; pin with pegs/spikes</text><rect x="425" y="85" width="110" height="34" fill="#d9b382" stroke="#8a5a2b" stroke-width="1.2" /><rect x="425" y="121" width="110" height="34" fill="#e3c79c" stroke="#8a5a2b" stroke-width="1.2" /><rect x="425" y="157" width="110" height="34" fill="#d9b382" stroke="#8a5a2b" stroke-width="1.2" /><rect x="425" y="193" width="110" height="34" fill="#e3c79c" stroke="#8a5a2b" stroke-width="1.2" /><line x1="480" y1="75" x2="480" y2="235" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/><text x="485" y="252.0" font-size="9" text-anchor="start" font-weight="normal" fill="#c0392b">drift pin / trunnel</text><text x="480" y="270.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">needs good flashing</text><text x="670" y="24.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1f2a33">Full-scribe (Scandinavian)</text><text x="670" y="40.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#44525e">no chinking; best seal</text><circle cx="670" cy="200" r="42" fill="#d9b382" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="670" cy="200" r="27.3" fill="none" stroke="#8a5a2b" stroke-width="0.5" opacity="0.6"/><circle cx="670" cy="200" r="14.7" fill="none" stroke="#8a5a2b" stroke-width="0.5" opacity="0.6"/><path d="M626,140 A 44 44 0 0 1 714 140 L 700 158 A 42 42 0 0 0 640 158 Z" fill="#e3c79c" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="670" cy="110" r="44" fill="#e3c79c" stroke="#8a5a2b" stroke-width="1.2"/><path d="M640,154 Q 670 140 700 154" fill="none" stroke="#2e7d32" stroke-width="4"/><line x1="700" y1="154" x2="745" y2="100" stroke="#1f2a33" stroke-width="0.8"/><circle cx="745" cy="100" r="2" fill="#1f2a33"/><text x="700" y="92.0" font-size="9" text-anchor="start" font-weight="normal" fill="#2e7d32">lateral groove</text><text x="700" y="103.0" font-size="9" text-anchor="start" font-weight="normal" fill="#2e7d32">+ wool/moss gasket</text><text x="670" y="270.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">upper log scribed to lower</text><rect x="0" y="285" width="780" height="45" fill="#f6f1e7" stroke="none" stroke-width="1.2" /><text x="12" y="303.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">Chinking (for saddle/square/dovetail walls): 1) stuff gaps with wood wedges or split poles, 2) pack moss, oakum or wool,</text><text x="12" y="318.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">3) finish with lime-sand-sawdust daub or clay-straw both sides. Re-chink after 1–2 years of settling (logs shrink ~5% across the grain).</text></svg>