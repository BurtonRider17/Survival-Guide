<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Roof framing"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="0" y="0" width="780" height="330" fill="#fff" stroke="none" stroke-width="1.2" /><rect x="20" y="230" width="30" height="70" fill="#b8895a" stroke="#8a5a2b" stroke-width="1" /><rect x="360" y="230" width="30" height="70" fill="#b8895a" stroke="#8a5a2b" stroke-width="1" /><text x="35" y="315.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">wall</text><polygon points="0.0,240.0 205.0,70.0 211.0,78.0 12.0,250.0" fill="#d9b382" stroke="#8a5a2b" stroke-width="1.2" /><polygon points="410.0,240.0 205.0,70.0 199.0,78.0 398.0,250.0" fill="#d9b382" stroke="#8a5a2b" stroke-width="1.2" /><rect x="199.0" y="62" width="12" height="26" fill="#b8895a" stroke="#8a5a2b" stroke-width="1" /><line x1="205.0" y1="66" x2="245.0" y2="40" stroke="#1f2a33" stroke-width="0.8"/><circle cx="245.0" cy="40" r="2" fill="#1f2a33"/><text x="248.0" y="40.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">ridge board</text><rect x="30" y="222" width="350" height="10" fill="#e3c79c" stroke="#8a5a2b" stroke-width="1" /><text x="205.0" y="250.0" font-size="9" text-anchor="middle" font-weight="600" fill="#c0392b">ceiling joist = rafter tie (resists outward thrust)</text><rect x="135.0" y="135" width="140" height="8" fill="#e3c79c" stroke="#8a5a2b" stroke-width="1" /><text x="205.0" y="130.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">collar tie (upper ⅓)</text><line x1="38" y1="226" x2="25" y2="150" stroke="#1f2a33" stroke-width="0.8"/><circle cx="25" cy="150" r="2" fill="#1f2a33"/><text x="15" y="145.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">birdsmouth seat</text><text x="90" y="300.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">Common-rafter roof: rafters at 40–60 cm (16–24") centers</text><text x="90" y="314.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#c0392b">Hurricane/uplift zones: strap every rafter to the wall</text><line x1="30" y1="285" x2="380" y2="285" stroke="#44525e" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="205.0" y="281.0" font-size="10" text-anchor="middle" font-weight="600" fill="#44525e">span</text><line x1="205.0" y1="82" x2="205.0" y2="220" stroke="#44525e" stroke-width="0.8" stroke-dasharray="3 3"/><text x="209.0" y="190.0" font-size="9" text-anchor="start" font-weight="normal" fill="#44525e">rise</text><polygon points="430.0,180.0 580.0,80.0 730.0,180.0" fill="none" stroke="#8a5a2b" stroke-width="6" /><line x1="430" y1="180" x2="730" y2="180" stroke="#8a5a2b" stroke-width="6"/><line x1="580" y1="80" x2="580" y2="180" stroke="#b8895a" stroke-width="5"/><line x1="580" y1="180" x2="505" y2="130" stroke="#b8895a" stroke-width="4"/><line x1="580" y1="180" x2="655" y2="130" stroke="#b8895a" stroke-width="4"/><rect x="573" y="73" width="14" height="14" fill="#cfd8dc" stroke="#1f2a33" stroke-width="0.8" /><rect x="573" y="173" width="14" height="14" fill="#cfd8dc" stroke="#1f2a33" stroke-width="0.8" /><rect x="498" y="123" width="14" height="14" fill="#cfd8dc" stroke="#1f2a33" stroke-width="0.8" /><rect x="648" y="123" width="14" height="14" fill="#cfd8dc" stroke="#1f2a33" stroke-width="0.8" /><rect x="423" y="173" width="14" height="14" fill="#cfd8dc" stroke="#1f2a33" stroke-width="0.8" /><rect x="723" y="173" width="14" height="14" fill="#cfd8dc" stroke="#1f2a33" stroke-width="0.8" /><text x="580" y="40.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2a33">King-post truss</text><text x="580" y="56.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#44525e">spans 6–9 m (20–30 ft) with no interior wall</text><text x="580" y="205.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">gusset plates: 12 mm plywood both sides,</text><text x="580" y="218.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">glued + nailed, or bolted steel plates</text><line x1="580" y1="175" x2="620" y2="245" stroke="#1f2a33" stroke-width="0.8"/><circle cx="620" cy="245" r="2" fill="#1f2a33"/><text x="580" y="258.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">top chord · bottom chord (tension) · web</text><line x1="505" y1="130" x2="470" y2="100" stroke="#1f2a33" stroke-width="0.8"/><circle cx="470" cy="100" r="2" fill="#1f2a33"/><text x="420" y="95.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">gusset</text><text x="580" y="290.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">Build all trusses on one floor jig so they match;</text><text x="580" y="304.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">set at 60 cm (24") and brace diagonally.</text></svg>