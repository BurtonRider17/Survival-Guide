<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Timber frame joints"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="0" y="0" width="760" height="260" fill="#fff" stroke="none" stroke-width="1.2" /><text x="130" y="22.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2a33">Mortise & tenon, pegged</text><rect x="40" y="50" width="50" height="190" fill="#d9b382" stroke="#8a5a2b" stroke-width="1.2" /><text x="65" y="252.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">post</text><rect x="90" y="115" width="170" height="50" fill="#e3c79c" stroke="#8a5a2b" stroke-width="1.2" /><text x="190" y="145.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">beam</text><rect x="45" y="125" width="45" height="30" fill="#e3c79c" stroke="#8a5a2b" stroke-width="1" stroke-dasharray="4 2"/><circle cx="68" cy="140" r="5" fill="#8a5a2b" stroke="#1f2a33" stroke-width="1"/><line x1="68" y1="140" x2="130" y2="85" stroke="#1f2a33" stroke-width="0.8"/><circle cx="130" cy="85" r="2" fill="#1f2a33"/><text x="100" y="78.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">oak peg (drawbored)</text><text x="140" y="190.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">tenon ≈ ⅓ beam thickness</text><text x="370" y="22.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2a33">Half-lap</text><polygon points="300.0,110.0 390.0,110.0 390.0,135.0 440.0,135.0 440.0,160.0 300.0,160.0" fill="#d9b382" stroke="#8a5a2b" stroke-width="1.2" /><polygon points="390.0,110.0 530.0,110.0 530.0,160.0 440.0,160.0 440.0,135.0 390.0,135.0" fill="#e3c79c" stroke="#8a5a2b" stroke-width="1.2" /><circle cx="415" cy="135" r="4" fill="#8a5a2b" stroke="#1f2a33" stroke-width="1"/><text x="415" y="185.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">half the depth from each piece; peg or bolt</text><text x="650" y="22.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2a33">Knee brace (racking)</text><rect x="560" y="50" width="36" height="190" fill="#d9b382" stroke="#8a5a2b" stroke-width="1.2" /><rect x="596" y="50" width="170" height="36" fill="#e3c79c" stroke="#8a5a2b" stroke-width="1.2" /><polygon points="596.0,170.0 596.0,145.0 701.0,86.0 726.0,86.0" fill="#b8895a" stroke="#8a5a2b" stroke-width="1.2" /><text x="670" y="150.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">45°; 60–90 cm legs</text><text x="670" y="163.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">both ends tenoned</text></svg>