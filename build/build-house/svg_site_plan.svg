<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Homestead site plan"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="0" y="0" width="760" height="520" fill="#eef3e6" stroke="none" stroke-width="1.2" /><path d="M0,60 C200,30 500,90 760,50" fill="none" stroke="#a7b58e" stroke-width="1"/><text x="8" y="56.0" font-size="8.5" text-anchor="start" font-weight="normal" fill="#6d7c55">elev. 112 m</text><path d="M0,120 C200,90 500,150 760,110" fill="none" stroke="#a7b58e" stroke-width="1"/><text x="8" y="116.0" font-size="8.5" text-anchor="start" font-weight="normal" fill="#6d7c55">elev. 110 m</text><path d="M0,190 C200,160 500,220 760,180" fill="none" stroke="#a7b58e" stroke-width="1"/><text x="8" y="186.0" font-size="8.5" text-anchor="start" font-weight="normal" fill="#6d7c55">elev. 108 m</text><path d="M0,470 C200,430 450,500 760,450 L760,520 L0,520 Z" fill="#cfe0ef" opacity="0.8"/><path d="M0,492 C220,455 470,520 760,475" fill="none" stroke="#2f7fbf" stroke-width="7"/><path d="M0,410 C200,380 450,450 760,400" fill="none" stroke="#2f7fbf" stroke-width="1.3" stroke-dasharray="6 4"/><text x="470" y="418.0" font-size="9.5" text-anchor="start" font-weight="600" fill="#2f7fbf">100-year flood line — build ABOVE this, plus margin</text><text x="560" y="505.0" font-size="10" text-anchor="start" font-weight="normal" fill="#2f7fbf" font-style="italic">creek</text><ellipse cx="390.0" cy="245.0" rx="200.0" ry="145.0" fill="#f9e0c0" opacity="0.55" stroke="#d08a3a" stroke-dasharray="4 3"/><ellipse cx="390.0" cy="245.0" rx="135.0" ry="96.25" fill="#f6cfa0" opacity="0.55" stroke="#d08a3a" stroke-dasharray="4 3"/><ellipse cx="390.0" cy="245.0" rx="95.0" ry="66.25" fill="#f2b880" opacity="0.55" stroke="#d08a3a" stroke-dasharray="4 3"/><text x="70" y="330.0" font-size="9.5" text-anchor="start" font-weight="700" fill="#a0521b">Fire-defensible zones</text><text x="70" y="343.0" font-size="9" text-anchor="start" font-weight="normal" fill="#a0521b">around house: 1.5 m · 9 m · 30 m</text><rect x="330" y="210" width="120" height="70" fill="#fff" stroke="#1f2a33" stroke-width="2" /><text x="390.0" y="249.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1f2a33">HOUSE</text><line x1="330" y1="280" x2="450" y2="280" stroke="#e69b00" stroke-width="5"/><text x="390.0" y="294.0" font-size="9" text-anchor="middle" font-weight="600" fill="#8a5a00">long side + most glass faces south</text><rect x="310" y="330" width="170" height="55" fill="#c5e1a5" stroke="#2e7d32" stroke-width="1" /><text x="395" y="362.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#2e7d32">garden / orchard (sunny side)</text><circle cx="60" cy="112" r="13" fill="#5d8a4a" stroke="#3e6b30" stroke-width="1"/><circle cx="88" cy="118" r="13" fill="#5d8a4a" stroke="#3e6b30" stroke-width="1"/><circle cx="116" cy="108" r="13" fill="#5d8a4a" stroke="#3e6b30" stroke-width="1"/><circle cx="144" cy="114" r="13" fill="#5d8a4a" stroke="#3e6b30" stroke-width="1"/><circle cx="172" cy="104" r="13" fill="#5d8a4a" stroke="#3e6b30" stroke-width="1"/><circle cx="200" cy="110" r="13" fill="#5d8a4a" stroke="#3e6b30" stroke-width="1"/><circle cx="228" cy="100" r="13" fill="#5d8a4a" stroke="#3e6b30" stroke-width="1"/><circle cx="256" cy="106" r="13" fill="#5d8a4a" stroke="#3e6b30" stroke-width="1"/><circle cx="284" cy="96" r="13" fill="#5d8a4a" stroke="#3e6b30" stroke-width="1"/><circle cx="40" cy="140" r="12" fill="#5d8a4a" stroke="#3e6b30" stroke-width="1"/><circle cx="40" cy="166" r="12" fill="#5d8a4a" stroke="#3e6b30" stroke-width="1"/><circle cx="40" cy="192" r="12" fill="#5d8a4a" stroke="#3e6b30" stroke-width="1"/><circle cx="40" cy="218" r="12" fill="#5d8a4a" stroke="#3e6b30" stroke-width="1"/><circle cx="40" cy="244" r="12" fill="#5d8a4a" stroke="#3e6b30" stroke-width="1"/><text x="100" y="86.0" font-size="9.5" text-anchor="start" font-weight="600" fill="#2e5a22">windbreak (evergreens) on winter-wind side, 2–5× tree height from house</text><line x1="20" y1="34" x2="62" y2="58" stroke="#2f7fbf" stroke-width="2.2" marker-end="url(#arb)"/><text x="22" y="22.0" font-size="9" text-anchor="start" font-weight="normal" fill="#2f7fbf">prevailing winter wind (NW in much of N. America)</text><circle cx="560" cy="120" r="10" fill="#cfe6f7" stroke="#2f7fbf" stroke-width="1.5"/><text x="546" y="112.0" font-size="9.5" text-anchor="end" font-weight="600" fill="#2f7fbf">well / spring box</text><text x="546" y="124.0" font-size="9" text-anchor="end" font-weight="normal" fill="#2f7fbf">uphill of outhouse</text><rect x="640" y="330" width="26" height="26" fill="#e7d1b0" stroke="#8a5a2b" stroke-width="1.5" /><text x="653" y="371.0" font-size="9.5" text-anchor="middle" font-weight="600" fill="#8a5a2b">outhouse</text><line x1="560" y1="130" x2="650" y2="330" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 3"/><text x="612" y="240.0" font-size="10" text-anchor="start" font-weight="700" fill="#c0392b">≥ 30 m</text><text x="612" y="252.0" font-size="9" text-anchor="start" font-weight="normal" fill="#c0392b">(100 ft)</text><rect x="200" y="235" width="60" height="30" fill="#d9b382" stroke="#8a5a2b" stroke-width="1" /><text x="230" y="254.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">woodshed</text><line x1="260" y1="250" x2="330" y2="250" stroke="#8a7d5a" stroke-width="1" stroke-dasharray="3 3"/><text x="270" y="244.0" font-size="8.5" text-anchor="start" font-weight="normal" fill="#6b5e3e">short covered path</text><circle cx="480" cy="230" r="14" fill="#cfe6f7" stroke="#2f7fbf" stroke-width="1.5"/><text x="480" y="234.0" font-size="10" text-anchor="middle" font-weight="700" fill="#2f7fbf">C</text><text x="498" y="220.0" font-size="9" text-anchor="start" font-weight="normal" fill="#2f7fbf">rain cistern</text><path d="M260,190 C330,180 450,180 520,195" fill="none" stroke="#7a9e5e" stroke-width="4" stroke-dasharray="10 4"/><text x="250" y="168.0" font-size="9" text-anchor="start" font-weight="600" fill="#4f6e3a">diversion swale (uphill) sheds runoff around house</text><g transform="translate(715,60)"><polygon points="0,-28 7,0 0,-6 -7,0" fill="#1f2a33"/><polygon points="0,28 7,0 0,6 -7,0" fill="#fff" stroke="#1f2a33"/><text x="0" y="-32.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1f2a33">N</text><text x="0" y="42.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2a33">S</text></g><text x="10" y="512.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33" font-style="italic">Not to scale. Northern-hemisphere layout; slope falls toward the creek (south).</text></svg>