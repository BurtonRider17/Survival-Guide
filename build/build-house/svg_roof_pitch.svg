<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Roof pitch guide"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="0" y="0" width="760" height="360" fill="#fff" stroke="none" stroke-width="1.2" /><line x1="60" y1="330" x2="320" y2="330" stroke="#1f2a33" stroke-width="1.5"/><text x="185.0" y="344.0" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2a33"></text><line x1="60" y1="330" x2="310" y2="309.1666666666667" stroke="#9e9e9e" stroke-width="2.4"/><text x="318" y="313.2" font-size="10" text-anchor="start" font-weight="600" fill="#9e9e9e">1:12 sod/membrane only  (5°)</text><line x1="60" y1="330" x2="310" y2="267.5" stroke="#7d8b96" stroke-width="2.4"/><text x="318" y="271.5" font-size="10" text-anchor="start" font-weight="600" fill="#7d8b96">3:12 min. metal panels  (14°)</text><line x1="60" y1="330" x2="310" y2="246.66666666666669" stroke="#6d4c41" stroke-width="2.4"/><text x="318" y="250.7" font-size="10" text-anchor="start" font-weight="600" fill="#6d4c41">4:12 shingles, shakes (min)  (18°)</text><line x1="60" y1="330" x2="310" y2="205.0" stroke="#2f7fbf" stroke-width="2.4"/><text x="318" y="209.0" font-size="10" text-anchor="start" font-weight="600" fill="#2f7fbf">6:12 general rain  (27°)</text><line x1="60" y1="330" x2="310" y2="163.33333333333334" stroke="#1f4e5f" stroke-width="2.4"/><text x="318" y="167.3" font-size="10" text-anchor="start" font-weight="600" fill="#1f4e5f">8:12 heavy snow  (34°)</text><line x1="60" y1="330" x2="310" y2="80.0" stroke="#8a5a00" stroke-width="2.4"/><text x="318" y="84.0" font-size="10" text-anchor="start" font-weight="600" fill="#8a5a00">12:12 (45°) thatch min.  (45°)</text><line x1="310" y1="330" x2="310" y2="80" stroke="#c5ccd2" stroke-width="1" stroke-dasharray="3 3"/><text x="185.0" y="326.0" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2a33">run = 12</text><text x="304" y="120.0" font-size="9.5" text-anchor="end" font-weight="normal" fill="#44525e">rise</text><text x="10" y="22.0" font-size="10.5" text-anchor="start" font-weight="700" fill="#1f2a33">Roof pitch = inches of rise per 12 inches of run.  Angle = arctan(rise ÷ 12).</text><text x="10" y="38.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#44525e">Steeper sheds rain and snow faster but uses more material and catches more wind.</text><text x="560" y="120.0" font-size="9.5" text-anchor="start" font-weight="600" fill="#1f2a33">Snow country: 8:12–12:12 so snow</text><text x="560" y="134.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">slides; metal sheds best.</text><text x="560" y="160.0" font-size="9.5" text-anchor="start" font-weight="600" fill="#1f2a33">Hurricane coasts: 4:12–6:12 hip</text><text x="560" y="174.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">roofs resist uplift best.</text><text x="560" y="200.0" font-size="9.5" text-anchor="start" font-weight="600" fill="#1f2a33">Sod roofs: 3:12–6:12 (heavy;</text><text x="560" y="214.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">steeper slides off).</text></svg>