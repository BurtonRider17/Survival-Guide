<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Rocket mass heater"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="0" y="0" width="760" height="330" fill="#fff" stroke="none" stroke-width="1.2" /><rect x="0" y="280" width="760" height="50" fill="#c9c6bf" stroke="none" stroke-width="1.2" /><rect x="70" y="120" width="40" height="140" fill="#fff" stroke="#1f2a33" stroke-width="2" /><text x="90" y="112.0" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1f2a33">feed tube</text><line x1="78" y1="125" x2="78" y2="200" stroke="#8a5a2b" stroke-width="3"/><line x1="84" y1="125" x2="84" y2="200" stroke="#8a5a2b" stroke-width="3"/><line x1="90" y1="125" x2="90" y2="200" stroke="#8a5a2b" stroke-width="3"/><line x1="96" y1="125" x2="96" y2="200" stroke="#8a5a2b" stroke-width="3"/><line x1="102" y1="125" x2="102" y2="200" stroke="#8a5a2b" stroke-width="3"/><rect x="70" y="220" width="160" height="40" fill="#ffe0b2" stroke="#1f2a33" stroke-width="2" /><text x="150" y="247.0" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1f2a33">burn tunnel</text><rect x="190" y="80" width="40" height="180" fill="#ffccbc" stroke="#1f2a33" stroke-width="2" /><rect x="176" y="80" width="14" height="180" fill="url(#ins)" stroke="#8a7d5a" stroke-width="0.8" /><rect x="230" y="80" width="14" height="180" fill="url(#ins)" stroke="#8a7d5a" stroke-width="0.8" /><text x="210" y="70.0" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1f2a33">insulated heat riser</text><rect x="150" y="50" width="120" height="210" fill="none" stroke="#7d8b96" stroke-width="3" rx="8"/><text x="210" y="42.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#7d8b96">steel barrel radiates heat</text><line x1="90" y1="150" x2="90" y2="240" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/><line x1="110" y1="240" x2="200" y2="240" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/><line x1="210" y1="230" x2="210" y2="90" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/><line x1="250" y1="70" x2="260" y2="235" stroke="#b97800" stroke-width="1.6" marker-end="url(#ar)"/><rect x="270" y="220" width="40" height="20" fill="#fff" stroke="#1f2a33" stroke-width="1" /><line x1="272" y1="230" x2="315" y2="230" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ar)"/><rect x="300" y="190" width="420" height="90" fill="#d7c4a3" stroke="#8a5a2b" stroke-width="1.5" /><text x="510" y="185.0" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1f2a33">cob / stone thermal-mass bench (stores heat 12–24 h)</text><rect x="310" y="220" width="380" height="20" fill="#fff" stroke="#1f2a33" stroke-width="1" /><line x1="320" y1="230" x2="680" y2="230" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ar)"/><rect x="690" y="80" width="20" height="160" fill="#7d8b96" stroke="#1f2a33" stroke-width="1" /><line x1="700" y1="220" x2="700" y2="70" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ar)"/><text x="680" y="75.0" font-size="9" text-anchor="end" font-weight="normal" fill="#1f2a33">exhaust to chimney</text><line x1="500" y1="230" x2="500" y2="150" stroke="#1f2a33" stroke-width="0.8"/><circle cx="500" cy="150" r="2" fill="#1f2a33"/><text x="420" y="146.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">flue duct inside mass</text><text x="10" y="22.0" font-size="12" text-anchor="start" font-weight="700" fill="#1f2a33">J-tube rocket mass heater (section)</text><text x="10" y="300.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">Same cross-section area through feed, tunnel, riser and duct (e.g., 6" ≈ 28 in²). Riser ≈ 3–4× tunnel length tall. Exhaust must still be warm enough to draft.</text><text x="10" y="314.0" font-size="9" text-anchor="start" font-weight="600" fill="#c0392b">Not covered by most codes; smoke-back and CO risk — CO alarm required, clean-outs at every bend, test draft before closing up the mass.</text></svg>