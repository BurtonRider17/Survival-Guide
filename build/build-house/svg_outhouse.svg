<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Outhouse section"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="0" y="0" width="760" height="380" fill="#fff" stroke="none" stroke-width="1.2" /><rect x="0" y="200" width="760" height="180" fill="#c8b48a" stroke="none" stroke-width="1.2" opacity="0.6"/><path d="M0,340 C200,330 500,350 760,335" fill="none" stroke="#2f7fbf" stroke-width="2" stroke-dasharray="7 4"/><text x="330" y="332.0" font-size="9.5" text-anchor="start" font-weight="700" fill="#2f7fbf">seasonal HIGH water table</text><rect x="140" y="60" width="150" height="140" fill="#e7d1b0" stroke="#8a5a2b" stroke-width="1.5" /><polygon points="125.0,60.0 215.0,25.0 305.0,60.0" fill="#7d8b96" stroke="#1f2a33" stroke-width="1.5" /><rect x="160" y="140" width="110" height="30" fill="#d9b382" stroke="#8a5a2b" stroke-width="1" /><text x="215" y="160.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">seat box + lid</text><rect x="128" y="194" width="174" height="12" fill="#b8895a" stroke="#8a5a2b" stroke-width="1" /><text x="124" y="188.0" font-size="8.5" text-anchor="end" font-weight="normal" fill="#1f2a33">sill on pad</text><rect x="160" y="206" width="110" height="90" fill="#8d6e4a" stroke="#1f2a33" stroke-width="1.2" fill-opacity="0.7"/><text x="215" y="250.0" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">PIT</text><text x="215" y="264.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#fff">1–1.5 m deep</text><rect x="154" y="206" width="6" height="90" fill="#b8895a" stroke="#8a5a2b" stroke-width="0.8" /><rect x="270" y="206" width="6" height="90" fill="#b8895a" stroke="#8a5a2b" stroke-width="0.8" /><line x1="276" y1="240" x2="330" y2="240" stroke="#1f2a33" stroke-width="0.8"/><circle cx="330" cy="240" r="2" fill="#1f2a33"/><text x="334" y="244.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">cribbed walls (top 0.5 m at least)</text><line x1="215" y1="296" x2="215" y2="340" stroke="#44525e" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="220.0" y="322.0" font-size="10" text-anchor="start" font-weight="600" fill="#44525e"></text><text x="220" y="322.0" font-size="9.5" text-anchor="start" font-weight="700" fill="#c0392b">≥ 1.2 m (4 ft)</text><rect x="260" y="15" width="10" height="130" fill="#9e9e9e" stroke="#1f2a33" stroke-width="1" /><text x="275" y="22.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">vent pipe, screened</text><text x="275" y="34.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">(black, sunny side)</text><rect x="160" y="70" width="18" height="14" fill="#fff" stroke="#1f2a33" stroke-width="1" /><text x="154" y="80.0" font-size="8.5" text-anchor="end" font-weight="normal" fill="#1f2a33">fly screen</text><text x="340" y="280.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">Mound soil around the base to shed rain.</text><rect x="640" y="110" width="40" height="90" fill="#cfd8dc" stroke="#1f2a33" stroke-width="1.2" /><rect x="652" y="200" width="16" height="160" fill="#cfe6f7" stroke="#2f7fbf" stroke-width="1" /><text x="660" y="100.0" font-size="10" text-anchor="middle" font-weight="700" fill="#2f7fbf">well</text><line x1="290" y1="120" x2="640" y2="120" stroke="#44525e" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="465.0" y="116.0" font-size="10" text-anchor="middle" font-weight="600" fill="#44525e">≥ 30 m (100 ft), and DOWNHILL of the well</text><text x="10" y="22.0" font-size="12" text-anchor="start" font-weight="700" fill="#1f2a33">Pit privy (outhouse) — section</text><text x="10" y="372.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33" font-style="italic">Add a scoop of ash, lime or sawdust after each use. When waste is 0.5 m (18 in) from the top: fill with soil, mound it, move the shelter.</text></svg>