<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Rain catchment"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="0" y="0" width="760" height="290" fill="#f7fbff" stroke="none" stroke-width="1.2" /><rect x="0" y="250" width="760" height="40" fill="#e6dfc8" stroke="none" stroke-width="1.2" /><rect x="60" y="120" width="260" height="130" fill="#fff" stroke="#1f2a33" stroke-width="1.5" /><polygon points="30.0,125.0 190.0,40.0 350.0,125.0" fill="#9aa7b0" stroke="#1f2a33" stroke-width="1.5" /><text x="190" y="100.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">metal roof (best for drinking water)</text><path d="M340,122 q 0 14 12 14 q 12 0 12 -14" fill="#cfd8dc" stroke="#1f2a33"/><text x="372" y="118.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">gutter 1:200 slope (~1/16" per ft)</text><rect x="352" y="134" width="10" height="40" fill="#cfd8dc" stroke="#1f2a33" stroke-width="1" /><rect x="352" y="170" width="90" height="10" fill="#cfd8dc" stroke="#1f2a33" stroke-width="1" /><rect x="372" y="180" width="12" height="60" fill="#cfd8dc" stroke="#1f2a33" stroke-width="1" /><text x="386" y="230.0" font-size="9" text-anchor="start" font-weight="700" fill="#1f2a33">first-flush</text><text x="386" y="242.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">diverter</text><rect x="440" y="140" width="14" height="40" fill="#cfd8dc" stroke="#1f2a33" stroke-width="1" /><text x="458" y="152.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">leaf screen</text><rect x="470" y="160" width="140" height="90" fill="#cfe6f7" stroke="#2f7fbf" stroke-width="1.6" rx="10"/><text x="540" y="205.0" font-size="11" text-anchor="middle" font-weight="700" fill="#2f7fbf">CISTERN</text><text x="540" y="220.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#2f7fbf">covered, opaque,</text><text x="540" y="232.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#2f7fbf">screened vents</text><rect x="610" y="175" width="50" height="6" fill="#cfd8dc" stroke="#1f2a33" stroke-width="1" /><text x="665" y="172.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">overflow</text><text x="665" y="194.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">away from house</text><rect x="480" y="236" width="10" height="10" fill="#7d8b96" stroke="#1f2a33" stroke-width="1.2" /><text x="470" y="268.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">tap ≥ 10 cm above floor</text><text x="10" y="22.0" font-size="12" text-anchor="start" font-weight="700" fill="#1f2a33">Gutters to rainwater catchment</text><text x="10" y="280.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33" font-style="italic">Yield: 1 inch of rain on 1,000 ft² of roof ≈ 623 US gal (1 mm on 1 m² = 1 L), less ~15–25% losses. Treat before drinking (see Water volume).</text></svg>