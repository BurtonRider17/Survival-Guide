<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Wall section"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="0" y="0" width="720" height="640" fill="#fff" stroke="none" stroke-width="1.2" /><rect x="0" y="490" width="720" height="150" fill="#c8b48a" stroke="none" stroke-width="1.2" opacity="0.55"/><polygon points="200.0,595.0 270.0,595.0 270.0,520.0 200.0,540.0" fill="#d8d4cb" stroke="#8b857a" stroke-width="0.6" /><circle cx="245" cy="580" r="8" fill="#fff" stroke="#2f7fbf" stroke-width="1.6"/><rect x="270" y="430" width="120" height="140" fill="#c9c6bf" stroke="#1f2a33" stroke-width="1.2" /><rect x="240" y="570" width="180" height="25" fill="#c9c6bf" stroke="#1f2a33" stroke-width="1.2" /><rect x="285" y="420" width="105" height="10" fill="#b8895a" stroke="#8a5a2b" stroke-width="1" /><line x1="284" y1="430" x2="390" y2="430" stroke="#000" stroke-width="2.2"/><rect x="285" y="390" width="10" height="30" fill="#b8895a" stroke="#8a5a2b" stroke-width="1" /><rect x="295" y="390" width="425" height="30" fill="url(#ins)" stroke="#8a7d5a" stroke-width="0.6" /><rect x="295" y="384" width="425" height="6" fill="#d9b382" stroke="#8a5a2b" stroke-width="1" /><rect x="285" y="378" width="98" height="6" fill="#b8895a" stroke="#8a5a2b" stroke-width="1" /><rect x="290" y="150" width="88" height="228" fill="url(#ins)" stroke="#8a7d5a" stroke-width="0.8" /><rect x="378" y="150" width="6" height="234" fill="#e8e2d6" stroke="#1f2a33" stroke-width="1" /><line x1="376" y1="150" x2="376" y2="378" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 3"/><rect x="278" y="150" width="12" height="240" fill="#c9a46e" stroke="#8a5a2b" stroke-width="1" /><rect x="274" y="150" width="4" height="240" fill="#fff" stroke="#8a7d5a" stroke-width="0.6" /><rect x="264" y="170" width="10" height="18" fill="#d9b382" stroke="#8a5a2b" stroke-width="0.5" /><rect x="264" y="200" width="10" height="18" fill="#d9b382" stroke="#8a5a2b" stroke-width="0.5" /><rect x="264" y="230" width="10" height="18" fill="#d9b382" stroke="#8a5a2b" stroke-width="0.5" /><rect x="264" y="260" width="10" height="18" fill="#d9b382" stroke="#8a5a2b" stroke-width="0.5" /><rect x="264" y="290" width="10" height="18" fill="#d9b382" stroke="#8a5a2b" stroke-width="0.5" /><rect x="264" y="320" width="10" height="18" fill="#d9b382" stroke="#8a5a2b" stroke-width="0.5" /><rect x="264" y="350" width="10" height="18" fill="#d9b382" stroke="#8a5a2b" stroke-width="0.5" /><rect x="256" y="150" width="8" height="275" fill="#e0c08f" stroke="#8a5a2b" stroke-width="1" /><rect x="285" y="136" width="98" height="7" fill="#b8895a" stroke="#8a5a2b" stroke-width="1" /><rect x="285" y="143" width="98" height="7" fill="#b8895a" stroke="#8a5a2b" stroke-width="1" /><polygon points="160.0,198.5 720.0,-81.5 720.0,-115.5 160.0,164.5" fill="#d9b382" stroke="#8a5a2b" stroke-width="1" /><polygon points="160.0,164.5 720.0,-115.5 720.0,-123.5 160.0,156.5" fill="#7d8b96" stroke="#1f2a33" stroke-width="1" /><rect x="154" y="162.5" width="6" height="38" fill="#b8895a" stroke="#8a5a2b" stroke-width="1" /><rect x="384" y="136" width="336" height="6" fill="#e8e2d6" stroke="#1f2a33" stroke-width="1" /><polygon points="300.0,136.0 720.0,136.0 720.0,-83.5 300.0,126.5" fill="url(#ins)" stroke="#8a7d5a" stroke-width="0.5" /><path d="M134,168.5 q 0 18 14 18 q 14 0 14 -18" fill="#cfd8dc" stroke="#1f2a33"/><text x="130" y="222.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33" stroke="#fff" stroke-width="3" paint-order="stroke">eave overhang 45–60 cm (18–24")</text><text x="130" y="234.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33" stroke="#fff" stroke-width="3" paint-order="stroke">+ gutter & drip edge</text><line x1="260" y1="270" x2="190" y2="270" stroke="#1f2a33" stroke-width="0.8"/><circle cx="260" cy="270" r="2.2" fill="#1f2a33"/><text x="186" y="273.5" font-size="9.5" text-anchor="end" font-weight="normal" fill="#1f2a33" stroke="#fff" stroke-width="3" paint-order="stroke">siding (boards, shakes, salvaged metal)</text><line x1="269" y1="305" x2="190" y2="305" stroke="#1f2a33" stroke-width="0.8"/><circle cx="269" cy="305" r="2.2" fill="#1f2a33"/><text x="186" y="308.5" font-size="9.5" text-anchor="end" font-weight="normal" fill="#1f2a33" stroke="#fff" stroke-width="3" paint-order="stroke">19 mm (¾") air gap on furring strips</text><line x1="276" y1="340" x2="190" y2="340" stroke="#1f2a33" stroke-width="0.8"/><circle cx="276" cy="340" r="2.2" fill="#1f2a33"/><text x="186" y="343.5" font-size="9.5" text-anchor="end" font-weight="normal" fill="#1f2a33" stroke="#fff" stroke-width="3" paint-order="stroke">weather barrier (house wrap / tar paper)</text><line x1="284" y1="375" x2="190" y2="375" stroke="#1f2a33" stroke-width="0.8"/><circle cx="284" cy="375" r="2.2" fill="#1f2a33"/><text x="186" y="378.5" font-size="9.5" text-anchor="end" font-weight="normal" fill="#1f2a33" stroke="#fff" stroke-width="3" paint-order="stroke">sheathing (diagonal boards or plywood)</text><line x1="270" y1="470" x2="190" y2="470" stroke="#1f2a33" stroke-width="0.8"/><circle cx="270" cy="470" r="2.2" fill="#1f2a33"/><text x="186" y="473.5" font-size="9.5" text-anchor="end" font-weight="normal" fill="#1f2a33" stroke="#fff" stroke-width="3" paint-order="stroke">foundation top ≥ 20 cm (8") above grade</text><line x1="245" y1="580" x2="190" y2="580" stroke="#2f7fbf" stroke-width="0.8"/><circle cx="245" cy="580" r="2.2" fill="#2f7fbf"/><text x="186" y="583.5" font-size="9.5" text-anchor="end" font-weight="normal" fill="#2f7fbf" stroke="#fff" stroke-width="3" paint-order="stroke">gravel + perforated drain to daylight</text><line x1="334" y1="250" x2="430" y2="250" stroke="#1f2a33" stroke-width="0.8"/><circle cx="334" cy="250" r="2.2" fill="#1f2a33"/><text x="434" y="253.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33" stroke="#fff" stroke-width="3" paint-order="stroke">cavity insulation (see insulation table)</text><line x1="376" y1="290" x2="430" y2="290" stroke="#c0392b" stroke-width="0.8"/><circle cx="376" cy="290" r="2.2" fill="#c0392b"/><text x="434" y="293.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#c0392b" stroke="#fff" stroke-width="3" paint-order="stroke">warm-side vapor retarder (cold climates only)</text><line x1="381" y1="330" x2="430" y2="330" stroke="#1f2a33" stroke-width="0.8"/><circle cx="381" cy="330" r="2.2" fill="#1f2a33"/><text x="434" y="333.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33" stroke="#fff" stroke-width="3" paint-order="stroke">interior finish (boards, plaster, drywall)</text><line x1="340" y1="146" x2="430" y2="164" stroke="#1f2a33" stroke-width="0.8"/><circle cx="340" cy="146" r="2.2" fill="#1f2a33"/><text x="434" y="167" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33" stroke="#fff" stroke-width="3" paint-order="stroke">doubled top plate; strap rafter to it</text><line x1="340" y1="425" x2="430" y2="425" stroke="#1f2a33" stroke-width="0.8"/><circle cx="340" cy="425" r="2.2" fill="#1f2a33"/><text x="434" y="428.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33" stroke="#fff" stroke-width="3" paint-order="stroke">sill plate on gasket + capillary break</text><line x1="490" y1="405" x2="430" y2="405" stroke="#1f2a33" stroke-width="0.8"/><circle cx="490" cy="405" r="2.2" fill="#1f2a33"/><text x="434" y="408.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33" stroke="#fff" stroke-width="3" paint-order="stroke">insulated floor over vented crawl</text><text x="490" y="80" font-size="9.5" text-anchor="start" font-weight="700" fill="#1f2a33" stroke="#fff" stroke-width="3" paint-order="stroke">ceiling insulation</text><text x="490" y="92" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33" stroke="#fff" stroke-width="3" paint-order="stroke">R-38 to R-60 in cold climates</text><text x="10" y="20.0" font-size="11" text-anchor="start" font-weight="700" fill="#44525e">OUTSIDE</text><text x="710" y="20.0" font-size="11" text-anchor="end" font-weight="700" fill="#44525e">INSIDE</text><text x="10" y="632.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33" font-style="italic">Cold-climate stick-frame wall. In hot-humid climates omit the interior vapor retarder so the wall dries inward.</text></svg>