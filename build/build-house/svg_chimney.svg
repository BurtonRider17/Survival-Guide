<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Stove and chimney clearances"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="0" y="0" width="780" height="450" fill="#fff" stroke="none" stroke-width="1.2" /><rect x="0" y="390" width="440" height="12" fill="#d9b382" stroke="#8a5a2b" stroke-width="1" /><rect x="40" y="60" width="12" height="330" fill="#e8e2d6" stroke="#1f2a33" stroke-width="1" /><text x="46" y="52.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">combustible wall</text><rect x="220" y="285" width="90" height="80" fill="#4a4a4a" stroke="#1f2a33" stroke-width="1.5" /><rect x="228" y="365" width="8" height="25" fill="#4a4a4a" stroke="#1f2a33" stroke-width="1.2" /><rect x="294" y="365" width="8" height="25" fill="#4a4a4a" stroke="#1f2a33" stroke-width="1.2" /><text x="265.0" y="330.0" font-size="10" text-anchor="middle" font-weight="700" fill="#fff">STOVE</text><rect x="255" y="70" width="20" height="215" fill="#7d8b96" stroke="#1f2a33" stroke-width="1" /><text x="282" y="100.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">single-wall</text><text x="282" y="111.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">stovepipe</text><rect x="90" y="386" width="330" height="6" fill="#a39e94" stroke="#1f2a33" stroke-width="1" /><line x1="52" y1="330" x2="220" y2="330" stroke="#44525e" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="136.0" y="326.0" font-size="10" text-anchor="middle" font-weight="600" fill="#44525e">36" (914 mm) unshielded</text><line x1="52" y1="170" x2="255" y2="170" stroke="#44525e" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="153.5" y="166.0" font-size="10" text-anchor="middle" font-weight="600" fill="#44525e">18" (457 mm) pipe</text><rect x="72" y="220" width="4" height="140" fill="#cfd8dc" stroke="#2f7fbf" stroke-width="1.5" /><text x="80" y="206" font-size="9" text-anchor="start" font-weight="600" fill="#2f7fbf" stroke="#fff" stroke-width="3" paint-order="stroke">sheet-metal shield on 1" spacers:</text><text x="80" y="218" font-size="9" text-anchor="start" font-weight="600" fill="#2f7fbf" stroke="#fff" stroke-width="3" paint-order="stroke">36" → about 12"</text><line x1="310" y1="375" x2="420" y2="375" stroke="#44525e" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="365.0" y="371.0" font-size="10" text-anchor="middle" font-weight="600" fill="#44525e">18" front</text><text x="20" y="418.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">Non-combustible hearth pad: 18" (457 mm) on the loading side, 8" (203 mm) on the other sides.</text><text x="20" y="432.0" font-size="9" text-anchor="start" font-weight="normal" fill="#44525e">Unlisted-stove values (NFPA 211). Listed stoves: follow the label. One appliance per flue.</text><polygon points="470.0,380.0 770.0,200.0 770.0,380.0" fill="#cfd8dc" stroke="#1f2a33" stroke-width="1.5" /><rect x="526" y="226.0" width="28" height="118.0" fill="#b85c38" stroke="#1f2a33" stroke-width="1.2" /><line x1="526" y1="232" x2="554" y2="232" stroke="#7a3b22" stroke-width="0.6"/><line x1="526" y1="244" x2="554" y2="244" stroke="#7a3b22" stroke-width="0.6"/><line x1="526" y1="256" x2="554" y2="256" stroke="#7a3b22" stroke-width="0.6"/><line x1="526" y1="268" x2="554" y2="268" stroke="#7a3b22" stroke-width="0.6"/><line x1="526" y1="280" x2="554" y2="280" stroke="#7a3b22" stroke-width="0.6"/><line x1="526" y1="292" x2="554" y2="292" stroke="#7a3b22" stroke-width="0.6"/><line x1="526" y1="304" x2="554" y2="304" stroke="#7a3b22" stroke-width="0.6"/><line x1="526" y1="316" x2="554" y2="316" stroke="#7a3b22" stroke-width="0.6"/><line x1="526" y1="328" x2="554" y2="328" stroke="#7a3b22" stroke-width="0.6"/><line x1="554" y1="266.0" x2="660" y2="266.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/><text x="606.0" y="280.0" font-size="9.5" text-anchor="middle" font-weight="700" fill="#c0392b">10 ft (3 m)</text><line x1="660" y1="266.0" x2="660" y2="226.0" stroke="#c0392b" stroke-width="1.2"/><text x="666" y="250.0" font-size="9.5" text-anchor="start" font-weight="700" fill="#c0392b">≥ 2 ft (0.6 m)</text><line x1="554" y1="226.0" x2="660" y2="226.0" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2 2"/><line x1="510" y1="338.0" x2="510" y2="226.0" stroke="#44525e" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="515.0" y="286.0" font-size="10" text-anchor="start" font-weight="600" fill="#44525e"></text><text x="504" y="282.0" font-size="9.5" text-anchor="end" font-weight="700" fill="#1f2a33">≥ 3 ft</text><text x="504" y="294.0" font-size="9" text-anchor="end" font-weight="normal" fill="#1f2a33">(0.9 m)</text><text x="460" y="30.0" font-size="13" text-anchor="start" font-weight="700" fill="#1f2a33">The 3-2-10 rule</text><text x="460" y="46.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#44525e">≥ 3 ft above where it exits the roof AND ≥ 2 ft higher than</text><text x="460" y="58.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#44525e">any roof, ridge or wall within 10 ft horizontally.</text><text x="460" y="84.0" font-size="9" text-anchor="start" font-weight="600" fill="#c0392b">Through walls/roofs: listed thimble or Class A</text><text x="460" y="96.0" font-size="9" text-anchor="start" font-weight="600" fill="#c0392b">insulated chimney — never bare stovepipe.</text><text x="460" y="418.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">Masonry chimney: 2" (51 mm) air space to framing.</text><text x="460" y="432.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">Cap with a spark arrestor; clean when soot ≥ ⅛" (3 mm).</text></svg>