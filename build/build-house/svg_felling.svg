<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Tree felling"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="0" y="0" width="760" height="260" fill="#fff" stroke="none" stroke-width="1.2" /><rect x="80" y="30" width="80" height="210" fill="#d9b382" stroke="#8a5a2b" stroke-width="1.2" /><polygon points="160.0,150.0 134.0,150.0 160.0,120.0" fill="#fff" stroke="#1f2a33" stroke-width="1" /><line x1="80" y1="158" x2="136" y2="158" stroke="#c0392b" stroke-width="2"/><text x="168" y="128.0" font-size="9.5" text-anchor="start" font-weight="700" fill="#1f2a33">open-face notch</text><text x="168" y="140.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">¼–⅓ diameter deep</text><text x="74" y="162.0" font-size="9.5" text-anchor="end" font-weight="700" fill="#c0392b">back cut</text><text x="74" y="174.0" font-size="9" text-anchor="end" font-weight="normal" fill="#c0392b">slightly above</text><text x="74" y="186.0" font-size="9" text-anchor="end" font-weight="normal" fill="#c0392b">notch floor</text><rect x="126" y="150" width="8" height="8" fill="#e69b00" stroke="none" stroke-width="1.2" /><line x1="130" y1="158" x2="200" y2="200" stroke="#1f2a33" stroke-width="0.8"/><circle cx="200" cy="200" r="2" fill="#1f2a33"/><text x="202" y="204.0" font-size="9.5" text-anchor="start" font-weight="700" fill="#8a5a00">hinge ≈ 10% of diameter</text><text x="202" y="216.0" font-size="9" text-anchor="start" font-weight="normal" fill="#8a5a00">— never cut through it</text><line x1="180" y1="60" x2="250" y2="60" stroke="#1f2a33" stroke-width="2" marker-end="url(#ar)"/><text x="190" y="52.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">fall direction</text><circle cx="560" cy="140" r="16" fill="#d9b382" stroke="#8a5a2b" stroke-width="1.2"/><line x1="560" y1="140" x2="560" y2="30" stroke="#1f2a33" stroke-width="2.4" marker-end="url(#ar)"/><text x="566" y="40.0" font-size="9.5" text-anchor="start" font-weight="700" fill="#1f2a33">planned fall</text><line x1="560" y1="140" x2="644.8528137423857" y2="224.8528137423857" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#ar)"/><line x1="560" y1="140" x2="475.1471862576143" y2="224.8528137423857" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#ar)"/><text x="410" y="250.0" font-size="9.5" text-anchor="start" font-weight="700" fill="#2e7d32">escape routes ~45° back from the line of fall</text><path d="M470,90 A 110 110 0 0 1 650 90" fill="none" stroke="#c0392b" stroke-dasharray="5 3"/><text x="670" y="80.0" font-size="9.5" text-anchor="start" font-weight="700" fill="#c0392b">keep everyone 2 tree-</text><text x="670" y="93.0" font-size="9.5" text-anchor="start" font-weight="700" fill="#c0392b">lengths away</text><text x="560" y="195.0" font-size="9" text-anchor="middle" font-weight="700" fill="#44525e">TOP VIEW</text><text x="120" y="254.0" font-size="9" text-anchor="middle" font-weight="700" fill="#44525e">SIDE VIEW</text></svg>