ight="normal" fill="#44525e">one person; no fire needed</text><line x1="420" y1="208" x2="400" y2="90" stroke="#1f2a33" stroke-width="0.8"/><circle cx="400" cy="90" r="2" fill="#1f2a33"/><text x="350" y="86.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">leaves/needles ≥ 60–90 cm thick</text><line x1="450" y1="242" x2="480" y2="120" stroke="#1f2a33" stroke-width="0.8"/><circle cx="480" cy="120" r="2" fill="#1f2a33"/><text x="440" y="114.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">dry leaf bed inside</text><text x="330" y="280.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">entrance downwind; plug with a debris pile</text><line x1="560" y1="250" x2="580" y2="125" stroke="#8a5a2b" stroke-width="3"/><line x1="760" y1="250" x2="740" y2="125" stroke="#8a5a2b" stroke-width="3"/><line x1="570" y1="140" x2="750" y2="140" stroke="#1f2a33" stroke-width="1.5"/><polygon points="590.0,140.0 730.0,140.0 780.0,250.0 640.0,250.0" fill="#9cc9ea" stroke="#2f7fbf" stroke-width="1.2" /><polygon points="590.0,140.0 540.0,250.0 640.0,250.0" fill="#cfe6f7" stroke="#2f7fbf" stroke-width="1.2" /><text x="660" y="30.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2a33">Tarp A-frame</text><text x="660" y="48.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#44525e">fast; ridge line between trees</text><line x1="700" y1="140" x2="720" y2="80" stroke="#1f2a33" stroke-width="0.8"/><circle cx="720" cy="80" r="2" fill="#1f2a33"/><text x="650" y="76.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">taut-line hitch ridge</text><text x="560" y="280.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">stake corners; ground pad essential</text></svg>