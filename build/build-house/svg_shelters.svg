<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Emergency shelters"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="0" y="0" width="760" height="300" fill="#f7f9fa" stroke="none" stroke-width="1.2" /><rect x="0" y="250" width="760" height="50" fill="#e6dfc8" stroke="none" stroke-width="1.2" /><line x1="165" y1="250" x2="165" y2="115" stroke="#8a5a2b" stroke-width="7"/><text x="170" y="108.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">tree / post</text><polygon points="160.0,128.0 172.0,132.0 40.0,250.0 22.0,250.0" fill="#6b8e4e" stroke="#3e6b30" stroke-width="1" /><line x1="150" y1="140" x2="125" y2="150" stroke="#3e6b30" stroke-width="3"/><line x1="126" y1="162" x2="101" y2="172" stroke="#3e6b30" stroke-width="3"/><line x1="102" y1="184" x2="77" y2="194" stroke="#3e6b30" stroke-width="3"/><line x1="78" y1="206" x2="53" y2="216" stroke="#3e6b30" stroke-width="3"/><line x1="54" y1="228" x2="29" y2="238" stroke="#3e6b30" stroke-width="3"/><circle cx="162" cy="130" r="7" fill="#b8895a" stroke="#8a5a2b" stroke-width="1.5"/><path d="M 200 250 q 12 -34