<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Passive solar section"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="0" y="0" width="760" height="380" fill="#f7fbff" stroke="none" stroke-width="1.2" /><rect x="0" y="300" width="760" height="80" fill="#e6dfc8" stroke="none" stroke-width="1.2" /><rect x="240" y="150" width="360" height="150" fill="#fff" stroke="#1f2a33" stroke-width="2" /><polygon points="150.0,150.0 420.0,60.0 620.0,150.0" fill="#cfd8dc" stroke="#1f2a33" stroke-width="1.5" /><text x="420" y="52.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">insulated roof</text><rect x="236" y="175" width="8" height="95" fill="#cfe6f7" stroke="#2f7fbf" stroke-width="1.5" /><text x="252" y="186" font-size="9.5" text-anchor="start" font-weight="600" fill="#2f7fbf" stroke="#fff" stroke-width="3" paint-order="stroke">south glass ≈ 7–12%</text><text x="252" y="198" font-size="9" text-anchor="start" font-weight="normal" fill="#2f7fbf" stroke="#fff" stroke-width="3" paint-order="stroke">of floor area</text><rect x="240" y="278" width="360" height="22" fill="#c9c6bf" stroke="#1f2a33" stroke-width="1" /><text x="410" y="293.0" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2a33">dark thermal-mass floor (stone, brick, earth, slab)</text><rect x="240" y="300" width="360" height="10" fill="url(#ins)" stroke="#8a7d5a" stroke-width="0.8" /><text x="608" y="322.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">insulation under</text><text x="608" y="334.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">and around mass</text><rect x="480" y="170" width="30" height="108" fill="#c49a6c" stroke="#1f2a33" stroke-width="1" /><text x="495" y="165.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#1f2a33">mass wall</text><line x1="16.363840040493727" y1="68.2553448322197" x2="240" y2="180" stroke="#e69b00" stroke-width="2.2"/><line x1="240" y1="180" x2="436.12878703795786" y2="278" stroke="#e69b00" stroke-width="1.6" stroke-dasharray="5 3"/><line x1="16.363840040493727" y1="118.2553448322197" x2="240" y2="230" stroke="#e69b00" stroke-width="2.2"/><line x1="240" y1="230" x2="336.06307936553037" y2="278" stroke="#e69b00" stroke-width="1.6" stroke-dasharray="5 3"/><line x1="16.363840040493727" y1="156.2553448322197" x2="240" y2="268" stroke="#e69b00" stroke-width="2.2"/><line x1="240" y1="268" x2="260.0131415344855" y2="278" stroke="#e69b00" stroke-width="1.6" stroke-dasharray="5 3"/><text x="10" y="322.0" font-size="10" text-anchor="start" font-weight="700" fill="#b97800">Winter noon sun ≈ 27° (at 40°N): low, enters deep, heats the mass</text><line x1="116.39350443524633" y1="31.17856004204765" x2="152" y2="151" stroke="#c0392b" stroke-width="2.4"/><text x="10" y="22.0" font-size="10" text-anchor="start" font-weight="700" fill="#c0392b">Summer noon sun ≈ 73°: high — overhang shades the glass</text><line x1="170" y1="148" x2="230" y2="100" stroke="#1f2a33" stroke-width="0.8"/><circle cx="230" cy="100" r="2" fill="#1f2a33"/><text x="235" y="98.0" font-size="9.5" text-anchor="start" font-weight="600" fill="#1f2a33">overhang sized for latitude</text><rect x="596" y="190" width="8" height="30" fill="#cfe6f7" stroke="#2f7fbf" stroke-width="1" /><text x="612" y="200.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">few, small</text><text x="612" y="212.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">north windows</text><text x="660" y="250.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">earth berm /</text><text x="660" y="262.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">storage on north</text><polygon points="600.0,300.0 600.0,230.0 750.0,300.0" fill="#c8b48a" stroke="#8a7d5a" stroke-width="1" /><text x="10" y="350.0" font-size="11" text-anchor="start" font-weight="700" fill="#1f2a33">◄ SOUTH</text><text x="750" y="350.0" font-size="11" text-anchor="end" font-weight="700" fill="#1f2a33">NORTH ►</text><text x="380.0" y="372.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2a33" font-style="italic">Noon solar altitude = 90° − latitude ± 23.45° (+ late June, − late December).</text></svg>