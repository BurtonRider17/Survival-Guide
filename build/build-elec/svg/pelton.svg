)</text><text x="200" y="352.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2a33" font-style="italic">Water drops freely into the tailrace — runner must sit ABOVE tailwater</text><rect x="470" y="40" width="280" height="290" rx="8" fill="#fff" stroke="#b0bec5"/><text x="610" y="60.0" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1f2a33">One bucket, seen from the jet</text><path d="M610,110 C580,108 535,130 530,180 C535,235 580,252 610,250 C640,252 685,235 690,180 C685,130 640,108 610,110 Z" fill="#cfd8dc" stroke="#1f2a33" stroke-width="1.4"/><ellipse cx="572" cy="180" rx="32" ry="55" fill="#a7b6bf" stroke="#546e7a"/><ellipse cx="648" cy="180" rx="32" ry="55" fill="#a7b6bf" stroke="#546e7a"/><line x1="610" y1="114" x2="610" y2="246" stroke="#1f2a33" stroke-width="2.2"/><path d="M596,110 L610,124 L624,110" fill="#fff" stroke="#1f2a33"/><circle cx="610" cy="180" r="9" fill="#2f7fbf" opacity="0.85"/><path d="M604,184 C570,220 530,210 514,174" fill="none" stroke="#2f7fbf" stroke-width="2" marker-end="url(#arb)"/><path d="M616,184 C650,220 690,210 706,174" fill="none" stroke="#2f7fbf" stroke-width="2" marker-end="url(#arb)"/><text x="610" y="274.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">Splitter ridge divides the jet; each half</text><text x="610" y="286.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">turns ~165° and leaves sideways/backward,</text><text x="610" y="298.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">giving up most of its energy.</text><text x="610" y="316.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2a33" font-style="italic">Notch (top) lets the jet reach the next bucket.</text><text x="628" y="86.0" font-size="9" text-anchor="start" font-weight="normal" fill="#444">notch</text><text x="598" y="202.0" font-size="9" text-anchor="end" font-weight="600" fill="#2f7fbf">jet</text></svg>