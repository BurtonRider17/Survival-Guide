<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Rocket stove cross section"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="0" y="0" width="520" height="350" fill="#fafbfc"/><rect x="150" y="80" width="210" height="220" fill="url(#ins)" stroke="#1f2a33" stroke-width="2"/><path d="M60,230 L230,230 L230,80 L280,80 L280,280 L60,280 Z" fill="#fff" stroke="#1f2a33" stroke-width="2"/><line x1="60" y1="262" x2="200" y2="262" stroke="#555" stroke-width="3"/><rect x="30" y="241" width="190" height="6" rx="3" fill="#8d6e63" stroke="#4e342e" stroke-width="0.7"/><rect x="36" y="248" width="190" height="6" rx="3" fill="#8d6e63" stroke="#4e342e" stroke-width="0.7"/><rect x="42" y="253" width="190" height="6" rx="3" fill="#8d6e63" stroke="#4e342e" stroke-width="0.7"/><path d="M200,256 C215,230 240,236 245,200 C252,170 240,140 255,110 C262,140 270,170 262,200 C258,230 262,240 252,262 Z" fill="#ff9800" opacity="0.8"/><path d="M226,252 C238,232 250,220 252,190 C258,215 254,236 244,258 Z" fill="#ffeb3b" opacity="0.9"/><line x1="70" y1="272" x2="190" y2="272" stroke="#2f7fbf" stroke-width="1.6" marker-end="url(#arb)"/><text x="20" y="318.0" font-size="9.5" text-anchor="start" font-weight="600" fill="#2f7fbf">Air enters under the shelf</text><rect x="215" y="66" width="8" height="14" fill="#333"/><rect x="287" y="66" width="8" height="14" fill="#333"/><path d="M190,66 L320,66 L310,22 L200,22 Z" fill="#455a64" stroke="#1f2a33"/><path d="M180,90 L180,30 M330,90 L330,30" stroke="#8d99a3" stroke-width="3"/><path d="M255,76 C250,60 220,62 200,50" fill="none" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arr)"/><path d="M255,76 C262,60 292,62 312,50" fill="none" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arr)"/><text x="370" y="40.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">Pot sits on supports with a</text><text x="370" y="52.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">small gap (~1–2 cm)</text><text x="370" y="74.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">Pot skirt forces hot gas</text><text x="370" y="86.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">along the pot sides</text><line x1="368" y1="82" x2="331" y2="70" stroke="#1f2a33" stroke-width="0.8"/><circle cx="331" cy="70" r="2" fill="#1f2a33"/><text x="370" y="130.0" font-size="10" text-anchor="start" font-weight="700" fill="#1f2a33">Insulated riser (chimney)</text><text x="370" y="142.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">≈ 2–3× as tall as feed is long</text><line x1="368" y1="134" x2="280" y2="140" stroke="#1f2a33" stroke-width="0.8"/><circle cx="280" cy="140" r="2" fill="#1f2a33"/><text x="370" y="180.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">Insulation: wood ash,</text><text x="370" y="192.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">perlite, vermiculite —</text><text x="370" y="204.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">never plain concrete</text><line x1="368" y1="188" x2="330" y2="200" stroke="#1f2a33" stroke-width="0.8"/><circle cx="330" cy="200" r="2" fill="#1f2a33"/><text x="10" y="200.0" font-size="10" text-anchor="start" font-weight="700" fill="#1f2a33">Fuel magazine:</text><text x="10" y="212.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">push sticks in</text><text x="10" y="224.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">as they burn</text><text x="10" y="342.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#c0392b" font-style="italic">Outdoor use or under a well-ventilated roof only — burning wood makes carbon monoxide.</text></svg>