<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Hydro electrical systems"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="0" y="0" width="780" height="290" fill="#fafbfc"/><text x="190" y="22.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2a33">A. Battery-based (most home systems)</text><rect x="10" y="50" width="100" height="56" rx="5" fill="#e3f2fd" stroke="#2f7fbf" stroke-width="1.3"/><text x="60.0" y="75.5" font-size="10" text-anchor="middle" font-weight="600" fill="#1f2a33">Turbine +</text><text x="60.0" y="87.5" font-size="10" text-anchor="middle" font-weight="600" fill="#1f2a33">PM alternator</text><rect x="140" y="50" width="92" height="56" rx="5" fill="#fff" stroke="#1f2a33" stroke-width="1.3"/><text x="186.0" y="69.5" font-size="10" text-anchor="middle" font-weight="600" fill="#1f2a33">Rectifier or</text><text x="186.0" y="81.5" font-size="8.5" text-anchor="middle" fill="#44525e">hydro-rated</text><text x="186.0" y="93.5" font-size="8.5" text-anchor="middle" fill="#44525e">MPPT ctrl</text><rect x="262" y="50" width="100" height="56" rx="5" fill="#cfd8dc" stroke="#1f2a33" stroke-width="1.3"/><text x="312.0" y="75.4" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1f2a33">Battery bank</text><text x="312.0" y="88.0" font-size="9.0" text-anchor="middle" fill="#44525e">12/24/48 V DC</text><line x1="110" y1="78" x2="138" y2="78" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><line x1="232" y1="78" x2="260" y2="78" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><rect x="262" y="140" width="100" height="50" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/><text x="312.0" y="162.5" font-size="10" text-anchor="middle" font-weight="600" fill="#1f2a33">Diversion</text><text x="312.0" y="174.5" font-size="10" text-anchor="middle" font-weight="600" fill="#1f2a33">controller</text><rect x="262" y="220" width="100" height="50" rx="5" fill="#ffccbc" stroke="#c0392b" stroke-width="1.3"/><text x="312.0" y="242.4" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1f2a33">Dump load</text><text x="312.0" y="255.0" font-size="9.0" text-anchor="middle" fill="#44525e">water/air heater</text><line x1="312" y1="106" x2="312" y2="138" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><line x1="312" y1="190" x2="312" y2="218" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><rect x="140" y="150" width="92" height="50" rx="5" fill="#fff" stroke="#1f2a33" stroke-width="1.3"/><text x="186.0" y="172.4" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1f2a33">Inverter</text><text x="186.0" y="185.0" font-size="9.0" text-anchor="middle" fill="#44525e">→ 120/240 V AC</text><polyline points="262,98 250,98 250,175 234,175" fill="none" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><rect x="10" y="150" width="100" height="50" rx="5" fill="#fff" stroke="#1f2a33" stroke-width="1.3"/><text x="60.0" y="178.7" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1f2a33">House loads</text><line x1="140" y1="175" x2="112" y2="175" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><text x="10" y="232.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">Battery covers short peaks far above</text><text x="10" y="244.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">turbine output; excess energy goes</text><text x="10" y="256.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">to the dump load once batteries are full.</text><text x="10" y="268.0" font-size="9.5" text-anchor="start" font-weight="600" fill="#1f2a33">Works with as little as 100–300 W.</text><line x1="392" y1="10" x2="392" y2="280" stroke="#b0bec5" stroke-width="1.5"/><text x="590" y="22.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2a33">B. AC-direct (larger sites, ≥ ~2–3 kW)</text><rect x="410" y="60" width="110" height="56" rx="5" fill="#e3f2fd" stroke="#2f7fbf" stroke-width="1.3"/><text x="465.0" y="79.5" font-size="10" text-anchor="middle" font-weight="600" fill="#1f2a33">Turbine +</text><text x="465.0" y="91.5" font-size="10" text-anchor="middle" font-weight="600" fill="#1f2a33">AC generator</text><text x="465.0" y="103.5" font-size="8.5" text-anchor="middle" fill="#44525e">60 Hz (50 Hz MX/CA*)</text><rect x="550" y="60" width="100" height="56" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/><text x="600.0" y="78.6" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2a33">ELC</text><text x="600.0" y="91.8" font-size="9.5" text-anchor="middle" fill="#44525e">electronic load</text><text x="600.0" y="105.0" font-size="9.5" text-anchor="middle" fill="#44525e">controller</text><rect x="680" y="60" width="90" height="56" rx="5" fill="#fff" stroke="#1f2a33" stroke-width="1.3"/><text x="725.0" y="85.4" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1f2a33">House loads</text><text x="725.0" y="98.0" font-size="9.0" text-anchor="middle" fill="#44525e">direct AC</text><line x1="520" y1="88" x2="548" y2="88" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><line x1="650" y1="88" x2="678" y2="88" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><rect x="550" y="160" width="100" height="50" rx="5" fill="#ffccbc" stroke="#c0392b" stroke-width="1.3"/><text x="600.0" y="182.4" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1f2a33">Ballast load</text><text x="600.0" y="195.0" font-size="9.0" text-anchor="middle" fill="#44525e">heaters</text><line x1="600" y1="116" x2="600" y2="158" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><text x="410" y="236.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">ELC keeps total load constant: as house loads turn</text><text x="410" y="248.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">off it diverts the same power to the ballast, holding</text><text x="410" y="260.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">speed, voltage and frequency steady. Turbine must</text><text x="410" y="272.0" font-size="9.5" text-anchor="start" font-weight="600" fill="#1f2a33">cover the biggest peak, including motor starting.</text></svg>