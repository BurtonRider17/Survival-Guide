nt-weight="700" fill="#2f7fbf">4 × 12 V 100 Ah → 24 V, 200 Ah</text><text x="665" y="211.0" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2a33">(4.8 kWh) two 24 V strings in parallel</text><rect x="20" y="232" width="740" height="66" rx="6" fill="#fff8e1" stroke="#e69b00"/><text x="34" y="252.0" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2a33">Rules: use identical batteries (same type, capacity, age, state of charge) in a bank. Keep parallel strings to 3 or fewer.</text><text x="34" y="268.0" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2a33">Make all interconnect cables the same length and gauge. Fuse each parallel string. Same total energy either way:</text><text x="34" y="284.0" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2a33">watt-hours = volts × amp-hours. Higher system voltage = lower current = thinner, cheaper, safer cables.</text></svg>