<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Biodiesel process flow"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="0" y="0" width="780" height="400" fill="#fafbfc"/><rect x="20" y="30" width="132" height="64" rx="5" fill="#fff" stroke="#1f2a33" stroke-width="1.3"/><text x="86.0" y="52.6" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2a33">1 Collect oil</text><text x="86.0" y="65.8" font-size="9.5" text-anchor="middle" fill="#44525e">veg oil, fryer oil,</text><text x="86.0" y="79.0" font-size="9.5" text-anchor="middle" fill="#44525e">rendered fat</text><rect x="175" y="30" width="132" height="64" rx="5" fill="#fff" stroke="#1f2a33" stroke-width="1.3"/><text x="241.0" y="52.6" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2a33">2 Filter + dewater</text><text x="241.0" y="65.8" font-size="9.5" text-anchor="middle" fill="#44525e">strain; heat & settle;</text><text x="241.0" y="79.0" font-size="9.5" text-anchor="middle" fill="#44525e">water < 0.1%</text><rect x="330" y="30" width="132" height="64" rx="5" fill="#fff" stroke="#1f2a33" stroke-width="1.3"/><text x="396.0" y="52.6" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2a33">3 Titrate</text><text x="396.0" y="65.8" font-size="9.5" text-anchor="middle" fill="#44525e">measure free fatty</text><text x="396.0" y="79.0" font-size="9.5" text-anchor="middle" fill="#44525e">acids → lye dose</text><rect x="485" y="30" width="132" height="64" rx="5" fill="#fff" stroke="#1f2a33" stroke-width="1.3"/><text x="551.0" y="52.6" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2a33">4 Heat oil</text><text x="551.0" y="65.8" font-size="9.5" text-anchor="middle" fill="#44525e">48–55 °C (120–130 °F)</text><text x="551.0" y="79.0" font-size="9.5" text-anchor="middle" fill="#44525e">never above 60 °C</text><line x1="152" y1="62" x2="173" y2="62" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><line x1="307" y1="62" x2="328" y2="62" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><line x1="462" y1="62" x2="483" y2="62" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><rect x="620" y="125" width="145" height="74" rx="5" fill="#ffebee" stroke="#c0392b" stroke-width="2.2"/><text x="692.5" y="145.3" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2a33">METHOXIDE</text><text x="692.5" y="159.1" font-size="10.0" text-anchor="middle" fill="#44525e">methanol (20% of oil vol.)</text><text x="692.5" y="172.9" font-size="10.0" text-anchor="middle" fill="#44525e">+ NaOH or KOH, mixed</text><text x="692.5" y="186.7" font-size="10.0" text-anchor="middle" fill="#44525e">in a closed container</text><text x="692" y="115.0" font-size="9.5" text-anchor="middle" font-weight="700" fill="#c0392b">⚠ toxic · caustic · flammable</text><rect x="485" y="220" width="132" height="70" rx="5" fill="#e3f2fd" stroke="#2f7fbf" stroke-width="1.3"/><text x="551.0" y="245.2" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2a33">5 React</text><text x="551.0" y="259.0" font-size="10.0" text-anchor="middle" fill="#44525e">add methoxide to oil;</text><text x="551.0" y="272.8" font-size="10.0" text-anchor="middle" fill="#44525e">mix ~1 h at 50–55 °C</text><line x1="551" y1="94" x2="551" y2="218" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><polyline points="692,199 692,255 619,255" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="330" y="220" width="132" height="70" rx="5" fill="#fff" stroke="#1f2a33" stroke-width="1.3"/><text x="396.0" y="245.2" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2a33">6 Settle</text><text x="396.0" y="259.0" font-size="10.0" text-anchor="middle" fill="#44525e">8–24 h; glycerin</text><text x="396.0" y="272.8" font-size="10.0" text-anchor="middle" fill="#44525e">sinks to bottom</text><line x1="485" y1="255" x2="464" y2="255" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><rect x="330" y="320" width="132" height="56" rx="5" fill="#fff3e0" stroke="#e69b00" stroke-width="1.3"/><text x="396.0" y="339.1" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1f2a33">Glycerin layer</text><text x="396.0" y="351.7" font-size="9.0" text-anchor="middle" fill="#44525e">~20% of volume;</text><text x="396.0" y="364.3" font-size="9.0" text-anchor="middle" fill="#44525e">contains methanol + lye</text><line x1="396" y1="290" x2="396" y2="318" stroke="#e69b00" stroke-width="1.6" marker-end="url(#ar)"/><rect x="175" y="220" width="132" height="70" rx="5" fill="#fff" stroke="#1f2a33" stroke-width="1.3"/><text x="241.0" y="245.2" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2a33">7 Wash</text><text x="241.0" y="259.0" font-size="10.0" text-anchor="middle" fill="#44525e">gentle water mist/</text><text x="241.0" y="272.8" font-size="10.0" text-anchor="middle" fill="#44525e">bubble wash ×3–4</text><line x1="330" y1="255" x2="309" y2="255" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><rect x="175" y="320" width="132" height="56" rx="5" fill="#fff3e0" stroke="#e69b00" stroke-width="1.3"/><text x="241.0" y="339.1" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1f2a33">Wash water</text><text x="241.0" y="351.7" font-size="9.0" text-anchor="middle" fill="#44525e">soapy, alkaline;</text><text x="241.0" y="364.3" font-size="9.0" text-anchor="middle" fill="#44525e">dispose safely</text><line x1="241" y1="290" x2="241" y2="318" stroke="#e69b00" stroke-width="1.6" marker-end="url(#ar)"/><rect x="20" y="220" width="132" height="70" rx="5" fill="#fff" stroke="#1f2a33" stroke-width="1.3"/><text x="86.0" y="245.2" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2a33">8 Dry</text><text x="86.0" y="259.0" font-size="10.0" text-anchor="middle" fill="#44525e">heat ~50 °C open-top</text><text x="86.0" y="272.8" font-size="10.0" text-anchor="middle" fill="#44525e">until crystal clear</text><line x1="175" y1="255" x2="154" y2="255" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><rect x="20" y="125" width="132" height="64" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/><text x="86.0" y="147.2" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2a33">9 Test</text><text x="86.0" y="161.0" font-size="10.0" text-anchor="middle" fill="#44525e">3/27 methanol test,</text><text x="86.0" y="174.8" font-size="10.0" text-anchor="middle" fill="#44525e">wash test, clarity</text><line x1="86" y1="220" x2="86" y2="191" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><rect x="175" y="125" width="132" height="64" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/><text x="241.0" y="147.7" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2a33">10 Filter + store</text><text x="241.0" y="160.8" font-size="9.5" text-anchor="middle" fill="#44525e">≤5 µm filter; sealed,</text><text x="241.0" y="174.1" font-size="9.5" text-anchor="middle" fill="#44525e">cool, dark, full</text><line x1="152" y1="157" x2="173" y2="157" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ar)"/><text x="20" y="395.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33" font-style="italic">Failed 3/27 test → re-process (second-stage reaction) rather than burning it in an engine.</text><text x="330" y="132.0" font-size="9.5" text-anchor="start" font-weight="600" fill="#1f2a33">Oil (triglyceride) + 3 methanol</text><text x="330" y="145.0" font-size="9.5" text-anchor="start" font-weight="600" fill="#1f2a33">→ 3 biodiesel (methyl esters)</text><text x="330" y="158.0" font-size="9.5" text-anchor="start" font-weight="600" fill="#1f2a33">  + glycerin   [lye = catalyst]</text></svg>