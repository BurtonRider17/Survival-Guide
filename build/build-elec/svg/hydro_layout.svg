<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="100%" style="font-family:IBM Plex Sans, Arial, sans-serif;max-height:100%" role="img" aria-label="Micro-hydro system layout"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9ad8a" stroke-width="1.2"/></pattern><pattern id="ins" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#b8a27a"/></pattern></defs><rect x="0" y="0" width="780" height="400" fill="#f4f9fd"/><polygon points="0,80 170,80 260,130 380,200 500,290 780,300 780,400 0,400" fill="#e6dfc8" stroke="#8a7d5a" stroke-width="1.5"/><rect x="0" y="66" width="128" height="14" fill="#2f7fbf" opacity="0.75"/><text x="10" y="60.0" font-size="11" text-anchor="start" font-weight="600" fill="#2f7fbf">Stream</text><path d="M140,84 C200,100 230,140 300,165 S420,250 470,300 L780,312" fill="none" stroke="#2f7fbf" stroke-width="3" opacity="0.45"/><rect x="128" y="58" width="9" height="24" fill="#9aa5ad" stroke="#1f2a33"/><rect x="146" y="50" width="36" height="32" fill="#fff" stroke="#1f2a33" stroke-width="1.3"/><rect x="147" y="60" width="34" height="21" fill="#2f7fbf" opacity="0.55"/><line x1="152" y1="52" x2="152" y2="81" stroke="#333" stroke-width="1.2" stroke-dasharray="2,2"/><path d="M137,66 L146,66" stroke="#2f7fbf" stroke-width="5"/><polyline points="180,78 262,124 382,194 486,272 506,282" fill="none" stroke="#3b4752" stroke-width="7" stroke-linejoin="round"/><polyline points="180,78 262,124 382,194 486,272 506,282" fill="none" stroke="#7f8f9b" stroke-width="3" stroke-linejoin="round"/><circle cx="486" cy="272" r="5" fill="#fff" stroke="#000"/><rect x="500" y="250" width="66" height="44" fill="#fff" stroke="#1f2a33" stroke-width="1.5"/><polygon points="494,250 533,226 572,250" fill="#b85c38" stroke="#1f2a33"/><circle cx="520" cy="278" r="11" fill="#cfd8dc" stroke="#1f2a33"/><rect x="537" y="270" width="20" height="16" fill="#e69b00" stroke="#1f2a33"/><text x="547" y="282.0" font-size="9" text-anchor="middle" font-weight="700" fill="#1f2a33">G</text><path d="M520,294 C530,308 560,312 600,310" fill="none" stroke="#2f7fbf" stroke-width="4"/><path d="M566,262 L650,262 L650,300 L700,300 L700,290" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,3"/><rect x="680" y="226" width="90" height="70" fill="#fff" stroke="#1f2a33" stroke-width="1.5"/><polygon points="672,226 725,190 778,226" fill="#6d4c41" stroke="#1f2a33"/><rect x="688" y="262" width="22" height="24" fill="#90a4ae" stroke="#1f2a33"/><text x="699" y="278.0" font-size="7" text-anchor="middle" font-weight="700" fill="#fff">BAT</text><rect x="716" y="236" width="20" height="16" fill="#fff" stroke="#1f2a33"/><text x="726" y="247.0" font-size="8" text-anchor="middle" font-weight="700" fill="#1f2a33">C</text><rect x="742" y="236" width="20" height="16" fill="#fff" stroke="#1f2a33"/><text x="752" y="247.0" font-size="6" text-anchor="middle" font-weight="700" fill="#1f2a33">INV</text><rect x="742" y="266" width="20" height="20" fill="#ffccbc" stroke="#1f2a33"/><text x="752" y="279.0" font-size="7" text-anchor="middle" font-weight="700" fill="#1f2a33">DL</text><text x="725" y="216.0" font-size="10" text-anchor="middle" font-weight="700" fill="#fff">7 House</text><line x1="182" y1="60" x2="610" y2="60" stroke="#555" stroke-dasharray="4,3" stroke-width="0.9"/><line x1="530" y1="278" x2="610" y2="278" stroke="#555" stroke-dasharray="4,3" stroke-width="0.9"/><line x1="600" y1="62" x2="600" y2="276" stroke="#1f2a33" stroke-width="1.4" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="612" y="110.0" font-size="11" text-anchor="start" font-weight="700" fill="#1f2a33">GROSS HEAD</text><text x="612" y="124.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">vertical drop from the</text><text x="612" y="136.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">forebay water surface</text><text x="612" y="148.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">down to the turbine nozzle</text><text x="40" y="128.0" font-size="10.5" text-anchor="start" font-weight="600" fill="#1f2a33">1  Intake weir + screen</text><line x1="100" y1="132" x2="132" y2="80" stroke="#1f2a33" stroke-width="0.8"/><circle cx="132" cy="80" r="2" fill="#1f2a33"/><text x="40" y="141.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">   diverts only part of the flow</text><text x="190" y="26.0" font-size="10.5" text-anchor="start" font-weight="600" fill="#1f2a33">2  Forebay / settling tank</text><line x1="200" y1="30" x2="172" y2="52" stroke="#1f2a33" stroke-width="0.8"/><circle cx="172" cy="52" r="2" fill="#1f2a33"/><text x="190" y="39.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">   keeps pipe inlet submerged, drops silt</text><text x="330" y="140.0" font-size="10.5" text-anchor="start" font-weight="600" fill="#1f2a33">3  Penstock (pressure pipe)</text><line x1="330" y1="144" x2="318" y2="160" stroke="#1f2a33" stroke-width="0.8"/><circle cx="318" cy="160" r="2" fill="#1f2a33"/><text x="330" y="153.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">   buried for UV + frost protection;</text><text x="330" y="165.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">   avoid humps (air traps)</text><text x="372" y="238.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33">Shut-off valve (close slowly)</text><line x1="440" y1="242" x2="482" y2="270" stroke="#1f2a33" stroke-width="0.8"/><circle cx="482" cy="270" r="2" fill="#1f2a33"/><text x="300" y="336.0" font-size="10.5" text-anchor="start" font-weight="600" fill="#1f2a33">4  Powerhouse: turbine + generator (G)</text><line x1="420" y1="328" x2="515" y2="292" stroke="#1f2a33" stroke-width="0.8"/><circle cx="515" cy="292" r="2" fill="#1f2a33"/><text x="300" y="352.0" font-size="10.5" text-anchor="start" font-weight="600" fill="#1f2a33">5  Tailrace returns ALL water to the stream</text><line x1="520" y1="344" x2="585" y2="311" stroke="#1f2a33" stroke-width="0.8"/><circle cx="585" cy="311" r="2" fill="#1f2a33"/><text x="300" y="368.0" font-size="10.5" text-anchor="start" font-weight="600" fill="#1f2a33">6  Transmission cable (buried, in conduit)</text><line x1="520" y1="360" x2="650" y2="300" stroke="#1f2a33" stroke-width="0.8"/><circle cx="650" cy="300" r="2" fill="#1f2a33"/><text x="600" y="336.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">C = controller</text><text x="600" y="348.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">INV = inverter</text><text x="690" y="336.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">BAT = batteries</text><text x="690" y="348.0" font-size="9" text-anchor="start" font-weight="normal" fill="#1f2a33">DL = dump load</text><text x="10" y="392.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2a33" font-style="italic">Net head = gross head − pipe friction losses (design for ≤10% loss).  Not to scale.</text></svg>