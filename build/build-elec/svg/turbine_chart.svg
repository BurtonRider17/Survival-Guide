at point are</text><text x="615" y="116.0" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2a33">candidates.</text><text x="615" y="130.0" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2a33"></text><text x="615" y="144.0" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2a33">Dotted lines: electrical</text><text x="615" y="158.0" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2a33">output at 50% overall</text><text x="615" y="172.0" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2a33">water-to-wire efficiency.</text><text x="615" y="186.0" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2a33"></text><text x="615" y="200.0" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2a33">Zones overlap and are</text><text x="615" y="214.0" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2a33">approximate; always</text><text x="615" y="228.0" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2a33">check the maker's</text><text x="615" y="242.0" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2a33">rated range.</text></svg>